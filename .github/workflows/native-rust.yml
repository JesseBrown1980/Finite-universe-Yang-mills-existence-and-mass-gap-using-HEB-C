name: Native HEB-C Rust 1.81 finite gauge verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  native-integer-gauge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.81 and Clippy
        run: rustup toolchain install 1.81.0 --profile minimal --component clippy --component rustfmt
      - name: Independent Rust unit tests (no network dependencies)
        working-directory: native
        run: cargo +1.81.0 test --all-targets --offline --locked
      - name: Zero-warning Clippy
        working-directory: native
        run: cargo +1.81.0 clippy --all-targets --offline --locked -- -D warnings
      - name: Native optimized binary
        working-directory: native
        run: cargo +1.81.0 build --release --offline --locked
      - name: Finite group spectral certificate
        working-directory: native
        run: target/release/hebc gap
      - name: Exact Gauss-sector counts and interacting spectrum certification
        working-directory: native
        run: |
          target/release/hebc sector single | grep 'physical_hilbert_dim=3'
          target/release/hebc sector double | grep 'physical_hilbert_dim=11'
          target/release/hebc sector torus2 | grep 'physical_hilbert_dim=1393'
          target/release/hebc spectrum 1 0 | grep 'positive=1'
          target/release/hebc spectrum 0 1 | grep 'positive=1'
          target/release/hebc spectrum 1 1 | grep 'positive=1'
          target/release/hebc spectrum 3 5 | grep 'positive=1'
          target/release/hebc spectrum 0 0 | grep 'positive=0'
      - name: Seven-link two-plaquette 11D interacting Hamiltonian - exact integer spectra
        working-directory: native
        run: |
          for coupling in '0 0' '1 0' '0 1' '1 1' '3 5'; do
            set -- $coupling
            dir="double-$1-$2"
            target/release/hebc double-spectrum "$1" "$2" "$dir"
            target/release/hebc double-verify "$dir"
            target/release/hebc double-spectrum "$1" "$2" "$dir-repeat"
            cmp "$dir/run.hbp" "$dir-repeat/run.hbp"
            cmp "$dir/index.hbi" "$dir-repeat/index.hbi"
            cmp "$dir/run.anchor" "$dir-repeat/run.anchor"
          done
          grep 'positive=0' double-0-0/run.measure
          grep 'positive=1' double-1-0/run.measure
          grep 'positive=1' double-0-1/run.measure
          grep 'positive=1' double-1-1/run.measure
          grep 'positive=1' double-3-5/run.measure
          cp -r double-1-1 double-corrupt
          printf X | dd of=double-corrupt/run.hbp bs=1 seek=160 conv=notrunc status=none
          if target/release/hebc double-verify double-corrupt; then exit 1; fi
          echo 'PASS: two-plaquette 11D source regeneration and tamper rejection'
      - name: Periodic 2x2 torus - actual 1393D sparse interacting S3 Hamiltonian
        working-directory: native
        run: |
          for coupling in '0 0' '1 0' '0 1' '1 1' '3 5'; do
            set -- $coupling
            dir="torus2-$1-$2"
            target/release/hebc torus2-spectrum "$1" "$2" "$dir"
            target/release/hebc torus2-verify "$dir"
            target/release/hebc torus2-spectrum "$1" "$2" "$dir-repeat"
            cmp "$dir/run.hbp" "$dir-repeat/run.hbp"
            cmp "$dir/index.hbi" "$dir-repeat/index.hbi"
            cmp "$dir/run.anchor" "$dir-repeat/run.anchor"
          done
          grep 'physical_dim=1393' torus2-1-1/run.measure
          grep 'flat_vacua=8' torus2-0-1/run.measure
          grep 'gap_exact=6' torus2-1-0/run.measure
          grep 'positive_qualitative=0' torus2-0-1/run.measure
          grep 'positive_qualitative=1' torus2-1-1/run.measure
          grep 'quantitative_gap_certified=0' torus2-1-1/run.measure
          cp -r torus2-1-1 torus2-corrupt
          printf X | dd of=torus2-corrupt/run.hbp bs=1 seek=138 conv=notrunc status=none
          if target/release/hebc torus2-verify torus2-corrupt; then exit 1; fi
          echo 'PASS: 1393D periodic torus, HBI/HBP and strict mixed-gap disclosure'
      - name: Multi-scale gauge-lattice stress - 64x64 and 128x128
        working-directory: native
        run: |
          target/release/hebc run 81 64 4096 stress-64
          target/release/hebc verify stress-64
          target/release/hebc run 9 128 0 stress-128
          target/release/hebc verify stress-128
          target/release/hebc run 9 128 0 stress-128-replay
          cmp stress-128/run.hbp stress-128-replay/run.hbp
          cmp stress-128/index.hbi stress-128-replay/index.hbi
          cmp stress-128/run.anchor stress-128-replay/run.anchor
      - name: Million Q-trit encoded lattice stress - 512x512
        working-directory: native
        run: |
          target/release/hebc run 3 512 0 stress-512
          target/release/hebc verify stress-512
          target/release/hebc run 3 512 0 stress-512-replay
          cmp stress-512/run.hbp stress-512-replay/run.hbp
          cmp stress-512/index.hbi stress-512-replay/index.hbi
          cmp stress-512/run.anchor stress-512-replay/run.anchor
      - name: Original Asolaria Constellation integration and honest residual bindings
        working-directory: native
        run: |
          target/release/hebc constellation-audit constellation-evidence
          target/release/hebc constellation-verify constellation-evidence
          target/release/hebc constellation-audit constellation-evidence-replay
          cmp constellation-evidence/run.hbp constellation-evidence-replay/run.hbp
          cmp constellation-evidence/index.hbi constellation-evidence-replay/index.hbi
          cmp constellation-evidence/run.anchor constellation-evidence-replay/run.anchor
          grep 'local_keys=45,405,3645' constellation-evidence/run.measure
          grep 'torus_orbits=1393' constellation-evidence/run.measure
          grep 'c1=UNVERIFIED' constellation-evidence/run.measure
          grep 'z_instant=UNVERIFIED' constellation-evidence/run.measure
          grep 'shadow_cat_tori=UNVERIFIED' constellation-evidence/run.measure
          cp -r constellation-evidence constellation-bad
          printf X | dd of=constellation-bad/index.hbi bs=1 seek=30 conv=notrunc status=none
          if target/release/hebc constellation-verify constellation-bad; then exit 1; fi
          echo "PASS: original Constellation transition and torus label audit"
      - name: Pinned Clasy X3 81-mode HTTP-0 and HBP HBI SHA chain
        working-directory: native
        run: |
          target/release/hebc clasy-run 0 1 243 clasy-single
          target/release/hebc clasy-verify clasy-single
          target/release/hebc clasy-run 0 1 243 clasy-repeat
          cmp clasy-single/run.hbp clasy-repeat/run.hbp
          cmp clasy-single/index.hbi clasy-repeat/index.hbi
          cmp clasy-single/run.anchor clasy-repeat/run.anchor
          target/release/hebc clasy-batch 81 243 clasy-batch-81
          test "$(find clasy-batch-81 -name run.anchor | wc -l)" -eq 81
          target/release/hebc clasy-verify clasy-batch-81/kernel-000
          target/release/hebc clasy-verify clasy-batch-81/kernel-080
          target/release/hebc clasy-batch 243 81 clasy-batch-243
          test "$(find clasy-batch-243 -name run.anchor | wc -l)" -eq 243
          target/release/hebc clasy-verify clasy-batch-243/kernel-000
          target/release/hebc clasy-verify clasy-batch-243/kernel-242
      - name: Clasy receipt corruption must fail
        working-directory: native
        run: |
          cp -r clasy-single clasy-corrupt
          printf X | dd of=clasy-corrupt/run.hbp bs=1 seek=180 conv=notrunc status=none
          if target/release/hebc clasy-verify clasy-corrupt; then exit 1; fi
          echo "PASS: Clasy chain rejects corrupted evidence"
      - name: Headless 243 steps / 23B virtual namespace / indexed evidence
        working-directory: native
        run: |
          target/release/hebc run 243 4 8192 evidence-native
          target/release/hebc verify evidence-native
      - name: Bit-exact native replay
        working-directory: native
        run: |
          target/release/hebc run 243 4 8192 evidence-native-again
          cmp evidence-native/run.hbp evidence-native-again/run.hbp
          cmp evidence-native/index.hbi evidence-native-again/index.hbi
          cmp evidence-native/run.anchor evidence-native-again/run.anchor
      - name: Verify native SHA-addressed state cache hit
        working-directory: native
        run: target/release/hebc cache-demo 243 4 | grep 'hits=1|misses=1'
      - name: Negative control rejects corrupted evidence
        working-directory: native
        run: |
          cp -r evidence-native evidence-native-corrupted
          printf X | dd of=evidence-native-corrupted/run.hbp bs=1 seek=45 conv=notrunc status=none
          if target/release/hebc verify evidence-native-corrupted; then echo 'tampering incorrectly accepted'; exit 1; fi
          echo "PASS: corrupted HBP rejected"
      - name: Native loopback wire-adapter smoke test
        working-directory: native
        run: |
          target/release/hebc serve 54881 > /tmp/hebc-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:54881/health | grep 'health=OK'
          curl --fail --silent --show-error http://127.0.0.1:54881/gap | grep 'graph_gap=3'
          curl --fail --silent --show-error http://127.0.0.1:54881/constellation | grep 'c1=UNVERIFIED'
          curl --fail --silent --show-error http://127.0.0.1:54881/clasy/3/1/9 | grep 'CLASY81|result=PASS'
          curl --fail --silent --show-error http://127.0.0.1:54881/double-spectrum/1/1 | grep 'positive=1'
          curl --fail --silent --show-error http://127.0.0.1:54881/torus2/1/1 | grep 'quantitative_gap_certified=0'
          curl --fail --silent --show-error http://127.0.0.1:54881/torus2/1/0 | grep 'gap_exact=6'
          curl --fail --silent --show-error http://127.0.0.1:54881/spectrum/1/1 | grep 'positive=1'
          curl --fail --silent --show-error http://127.0.0.1:54881/qtrit/243 | grep 'ordinal=243'
      - name: Store measured receipts from CI
        uses: actions/upload-artifact@v4
        with:
          name: hecb-rust-native-243-receipts
          path: |
            native/evidence-native/
            native/stress-64/
            native/stress-128/
            native/stress-512/
            native/double-0-0/
            native/double-1-0/
            native/double-0-1/
            native/double-1-1/
            native/double-3-5/
            native/torus2-0-0/
            native/torus2-1-0/
            native/torus2-0-1/
            native/torus2-1-1/
            native/torus2-3-5/
            native/constellation-evidence/
            native/clasy-single/
            native/clasy-batch-81/kernel-000/
            native/clasy-batch-81/kernel-080/
            native/clasy-batch-81/batch.measure
            native/clasy-batch-243/kernel-000/
            native/clasy-batch-243/kernel-242/
            native/clasy-batch-243/batch.measure
