name: Issue 137 replay actual K3 mu1 and degree-one Schur sandwich
on:
  pull_request:
    paths:
      - 'independent/y137-real-Q-moment-20261114/replay_n1.py'
      - 'independent/y137-real-Q-moment-20261114/RESULT-MU1.hbp'
      - 'independent/y137-real-Q-moment-20261114/RESULT-MU1-SHARD-EVIDENCE.hbp'
      - '.github/workflows/y137-realQ-mu1-n1-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-independent-reassembly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reassemble all 8 original hosted shards, independently check Loewner bounds and exact n1 center
        run: |
          set -euo pipefail
          mkdir -p build/y137-mu1-n1
          python3 -I -B independent/y137-real-Q-moment-20261114/replay_n1.py | tee build/y137-mu1-n1/RESULT-N1.hbp
          test "$(grep -c '^Y137_N1_POINT|' build/y137-mu1-n1/RESULT-N1.hbp)" -eq 2
          grep -Fq 'strict_two_sided_improvement_PSD=1|new_corrected_schur_center=EXACT|' build/y137-mu1-n1/RESULT-N1.hbp
          grep -Fq 'actual_K3_corrected_Schur_degree=1|actual_wholeQ_mu0_mu1=EXACT|degree1_fullQ_two_sided_sandwich=PASS|' build/y137-mu1-n1/RESULT-N1.hbp
          grep -Fq 'independent_raw_move_source_review=PENDING|actual_Wilson_weight=HOLD|' build/y137-mu1-n1/RESULT-N1.hbp
      - name: Strict no-float and source integer arithmetic audits
        run: |
          set -euo pipefail
          python3 -I -X utf8 native/scripts/no_float_gate.py .
          python3 -I -X utf8 native/scripts/integer_only_audit.py independent/y137-real-Q-moment-20261114/replay_n1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y137-actual-K3-mu1-independent-n1-Schur
          path: build/y137-mu1-n1/RESULT-N1.hbp
          retention-days: 60
          if-no-files-found: ignore
