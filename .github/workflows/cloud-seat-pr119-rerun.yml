name: Cloud seat re-run of PR 119 on its exact head

on:
  workflow_dispatch:
  push:
    branches: [cloud-seat-pr119-rerun-20261106]
    paths: ['.github/workflows/cloud-seat-pr119-rerun.yml']

permissions:
  contents: read

env:
  HEAD_SHA: 33df6f77771620fe2542341b0800a1b04bbe5851
  EV: native/ym/results/issue3-bindings-20261106

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: '33df6f77771620fe2542341b0800a1b04bbe5851', fetch-depth: 8, persist-credentials: false }
      - name: Exact head, commit order, frozen prediction
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git log --format='%h %s' -4
          test "$(git log --format=%h -1 3f3325c)" = 3f3325c
          git diff-tree --no-commit-id --name-only -r 3f3325c | sort | tee /tmp/pred-files
          test "$(wc -l < /tmp/pred-files)" = 2
          sha256sum "$EV/PREDICTION-ISSUE3.hbp"
          test "$(sha256sum < "$EV/PREDICTION-ISSUE3.hbp" | cut -c1-64)" = cf9c22657c16098e1d19aa0ce5a7a352242cd6d1578e0746409bbede31698a17
          cmp <(git show 3f3325c:$EV/PREDICTION-ISSUE3.hbp) "$EV/PREDICTION-ISSUE3.hbp"
          echo "PREDICTION|commit=3f3325c|alone=1|byte_identical_at_head=1|json=0"
      - name: Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal --component clippy --component rustfmt
      - name: All native tests
        working-directory: native
        run: cargo +1.81.0 test --all-targets --offline --locked 2>&1 | tee /tmp/test.log
      - name: The issue3 tests by name
        working-directory: native
        run: |
          cargo +1.81.0 test --all-targets --offline --locked issue3 2>&1 | tee /tmp/issue3.log
          grep -E '^test .*issue3' /tmp/issue3.log
          grep -c -E '^test .*issue3.* ok$' /tmp/issue3.log
          if grep -n 'MISS' /tmp/test.log /tmp/issue3.log; then echo "MISS lines above"; else echo "MISS_LINES=0"; fi
      - name: Clippy -D warnings
        working-directory: native
        run: cargo +1.81.0 clippy --all-targets --offline --locked -- -D warnings
      - name: Regenerate the issue3 evidence and compare byte for byte
        working-directory: native
        run: |
          cargo +1.81.0 build --release --offline --locked
          target/release/hebc issue3-audit e
          target/release/hebc issue3-verify e
          for f in run.hbp index.hbi run.anchor run.measure; do cmp "e/$f" "ym/results/issue3-bindings-20261106/evidence/$f"; echo "SAME $f"; done
          (cd ../$EV/evidence && sha256sum -c SHA256SUMS)
          cat e/run.measure
          cp -r e e-bad
          printf X | dd of=e-bad/run.hbp bs=1 seek=100 conv=notrunc status=none
          if target/release/hebc issue3-verify e-bad; then echo "tampered evidence verified"; exit 1; fi
          echo "PASS: regenerated byte for byte; tampered copy rejected"

  no-float:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: '33df6f77771620fe2542341b0800a1b04bbe5851', persist-credentials: false }
      - run: python3 -I -X utf8 native/scripts/no_float_gate.py --selftest
      - run: python3 -I -X utf8 native/scripts/no_float_gate.py .

  no-float-compiled:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: '33df6f77771620fe2542341b0800a1b04bbe5851', persist-credentials: false }
      - name: Rust 1.81 and the GMP headers
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          sudo apt-get update -qq && sudo apt-get install -y -qq libgmp-dev
      - run: python3 -I -X utf8 native/scripts/compiled_float_check.py selftest
      - name: Every Rust crate compiled and read
        run: |
          python3 -I -X utf8 native/scripts/compiled_float_check.py rust . | tee /tmp/rust.hbp
          grep -q '^COMPILED_RUST_DONE|.*|project_fp_lines=0|project_mir_lines=0|project_crates_reaching=0|.*|failed=0|' /tmp/rust.hbp
      - name: Every C and C++ file compiled and read
        run: |
          python3 -I -X utf8 native/scripts/compiled_float_check.py cpp . | tee /tmp/cpp.hbp
          grep -q '^COMPILED_CPP_DONE|.*|not_measured=0|failed=0|' /tmp/cpp.hbp

  row5-source-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: The three pinned sources, searched again
        run: |
          s() { # repo commit
            git init -q "$1" && git -C "$1" fetch -q --depth 1 "https://github.com/JesseBrown1980/$1" "$2"
            git -C "$1" checkout -q "$2"
            n=$(git -C "$1" ls-files | wc -l)
            h=$( { git -C "$1" grep -I -i -E -c 'z[-_ ]?instant' "$2" -- . || true; } | wc -l)
            echo "SEARCH|repo=$1|commit=$2|files=$n|pattern=z[-_ ]?instant|files_with_hits=$h|json=0"
          }
          s the-human-based-understanding f38cfec0c910a5997f156e9e599d097cacf0c578
          s the-zebras-z-is-the-squared-wave 3b3fe023427efcd4f86b1c8299dc92ed121a9aef
          s ASOLARIA-UNIVERSE-SIMULATOR-with-gravity-light-time-space-color-rime-winding-drills 3f9f42dab6247c40b30921b253e3f73c9e942ca5
          git -C the-human-based-understanding rev-parse f38cfec0c910a5997f156e9e599d097cacf0c578:README.md
          git -C the-zebras-z-is-the-squared-wave rev-parse 3b3fe023427efcd4f86b1c8299dc92ed121a9aef:index.html
          git -C ASOLARIA-UNIVERSE-SIMULATOR-with-gravity-light-time-space-color-rime-winding-drills rev-parse 3f9f42dab6247c40b30921b253e3f73c9e942ca5:books/LAW-71-HOTTER-BLACK-SHADOW-CAT-SPHERICAL-AMPLIFICATION.md
