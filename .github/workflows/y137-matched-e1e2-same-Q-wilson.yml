name: Y137 matched E1 E2 original Wilson same-Q direct dual
on:
  pull_request:
    paths:
      - 'independent/y137-matched-e1e2-joint-wilson-20261118/**'
      - '.github/workflows/y137-matched-e1e2-same-Q-wilson.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-original-Wilson-Q-dual:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Original physical source and exact integer policy
        run: |
          set -euo pipefail
          D=independent/y137-matched-e1e2-joint-wilson-20261118
          python3 -I -B native/scripts/integer_only_audit.py "$D/matched_dual.py" "$D/verify.py"
          python3 -I -B native/scripts/no_float_gate.py .
          test "$(git hash-object independent/y137-q-dual-weight-20261113/replay.py)" = 'b9881651c51a278757bc0fef15de583277330da3'
          test "$(git hash-object independent/y137-q-dual-weight-20261113/RESULT-WILSON-Q-DUAL.hbp)" = '40762ceb865829156e4765b720f52d39a8be9b6f'
          python3 -I -B "$D/matched_dual.py" toy | tee /tmp/y137-match-dual-toy.hbp
          grep -Fq '|signed_dual_identity=PASS|quadratic_error_term=RETAINED|' /tmp/y137-match-dual-toy.hbp
      - name: Recenter both true projector witnesses and recompute original full Q Wilson
        run: |
          set -euo pipefail
          D=independent/y137-matched-e1e2-joint-wilson-20261118
          mkdir -p build/y137-matched-pair-wilson
          /usr/bin/time -v python3 -I -B "$D/matched_dual.py" real | tee build/y137-matched-pair-wilson/ALL.hbp
          grep -E '^Y137_(DUAL_WINDOW_TOY|MATCHED_PAIR|DUAL_WINDOW_SOURCE|DUAL_WINDOW_SIGNED|JOINT_DUAL_AUDIT|MATCHED_PROJECTOR_BOUND|JOINT_DUAL_VERDICT)\|' build/y137-matched-pair-wilson/ALL.hbp > build/y137-matched-pair-wilson/RESULT.hbp
          python3 -I -B "$D/verify.py" build/y137-matched-pair-wilson/RESULT.hbp | tee build/y137-matched-pair-wilson/REPLAY.hbp
          grep -Fq '|tamper=8_REJECTED|' build/y137-matched-pair-wilson/REPLAY.hbp
          grep -Fq '|actual_original_first_excitation_Wilson_weight=HOLD|' build/y137-matched-pair-wilson/RESULT.hbp
          sha256sum "$D/matched_dual.py" "$D/verify.py" > build/y137-matched-pair-wilson/SOURCE.sha256
          sha256sum build/y137-matched-pair-wilson/RESULT.hbp > build/y137-matched-pair-wilson/RESULT.sha256
          git rev-parse HEAD > build/y137-matched-pair-wilson/COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y137-original-S3-matched-E1E2-Wilson-sameQ-dual
          path: build/y137-matched-pair-wilson/
          retention-days: 90
          if-no-files-found: error
