    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: Build offline from vendored sources
        working-directory: native/ym
        run: cargo build --release --offline --locked
      - name: Fresh sector + one job + verify
        working-directory: native/ym
        env:
          HEBC_YM_FRESH: "1"
        run: |
          set -euo pipefail
          B=target/release/hebc_ym_http0; R=$RUNNER_TEMP/root; spec="${{ matrix.spec }}"
          kind=${spec%%/*}
          case $kind in *countcols) mode=${kind%countcols} ;; *count) mode=${kind%count} ;; esac
          sec="${mode}sector/$(echo $spec | cut -d/ -f2-5)"; id=$(echo $spec | tr / _)
          $B job $R $sec
          $B job $R $spec | tee job.txt
          $B verify $R $spec | tee -a job.txt
          grep -q '^HEBC_YM|result=PASS|action=verify|' job.txt
          case $kind in *count) grep -q '|ambiguous=0|result=PASS|' $R/shards/$id/run.hbp ;; esac
          mkdir -p out/shards; cp -r $R/shards/$id out/shards/
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: native/ym/out

  merge:
    name: Merge ${{ matrix.id }} ${{ matrix.spec }}
    needs: cell
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: "m01", spec: "tacountmerge/3/3/1/1/1000/9000/71900000/12/1000"}
          - {id: "m02", spec: "tdcountmerge/3/3/1/1/1000/9000/71900000/12/1000"}
          - {id: "m03", spec: "tacountmerge/3/3/1/-1/1000/9000/71900000/12/1000"}
          - {id: "m04", spec: "tdcountmerge/3/3/1/-1/1000/9000/71900000/12/1000"}
          - {id: "m05", spec: "txcountmerge/3/3/1/1/1000/9000/71900000/12/1000"}
          - {id: "m06", spec: "tycountmerge/3/3/1/1/1000/9000/71900000/12/1000"}
          - {id: "m07", spec: "txcountmerge/3/3/1/-1/1000/9000/71900000/12/1000"}
          - {id: "m08", spec: "tycountmerge/3/3/-1/1/1000/9000/71900000/12/1000"}
          - {id: "m09", spec: "txcountmerge/3/3/-1/-1/1000/9000/71900000/12/1000"}
          - {id: "m10", spec: "tycountmerge/3/3/-1/-1/1000/9000/71900000/12/1000"}
          - {id: "m11", spec: "txcountmerge/3/3/-1/1/1000/9000/71900000/12/1000"}
          - {id: "m12", spec: "tycountmerge/3/3/1/-1/1000/9000/71900000/12/1000"}
          - {id: "m13", spec: "countmerge/3/3/1/1/1000/9000/71900000/12/1000"}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        if: matrix.spec != 'none'
      - uses: actions/download-artifact@v4
        if: matrix.spec != 'none'
        with:
          pattern: cell-*
          path: cells
          merge-multiple: true
      - name: Toolchain 1.81
        if: matrix.spec != 'none'
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: countmerge + verify
        if: matrix.spec != 'none'
        env:
          HEBC_YM_FRESH: "1"
        run: |
          set -euo pipefail
          (cd native/ym && cargo build --release --offline --locked)
          B=native/ym/target/release/hebc_ym_http0; R=$RUNNER_TEMP/root; spec="${{ matrix.spec }}"
          kind=${spec%%/*}; mode=${kind%countmerge}; rest=${spec#*/}
          cid=$(echo "${mode}count/$rest" | tr / _); id=$(echo $spec | tr / _)
          mkdir -p $R/scol/$cid
          cp -r cells/shards/${mode}countcols_$(echo $rest | tr / _)_* $R/scol/$cid/
          $B job $R "${mode}sector/$(echo $rest | cut -d/ -f1-4)"
          $B job $R $spec | tee job.txt
          $B verify $R $spec | tee -a job.txt
          grep -q '^HEBC_YM|result=PASS|action=verify|' job.txt
          grep -q '|ambiguous=0|result=PASS|' $R/shards/$id/run.hbp
          mkdir -p out/shards; cp -r $R/shards/$id out/shards/
      - uses: actions/upload-artifact@v4
        if: matrix.spec != 'none'
        with:
          name: merge-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: out

  seal:
    name: Seal part 1/2
    needs: [cell, merge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arts
          merge-multiple: true
      - name: Integrity and seal
        run: |
          set -euo pipefail
          test "${{ needs.cell.result }}" = success
          test "${{ needs.merge.result }}" = success
          python3 native/ym/python/verify_shard_integrity.py arts/shards | tee seal.hbp
          grep -q '|failed=0|.*|result=PASS|' seal.hbp
          mkdir -p sealed/shards
          for id in tacountmerge_3_3_1_1_1000_9000_71900000_12_1000 tdcountmerge_3_3_1_1_1000_9000_71900000_12_1000 tacountmerge_3_3_1_-1_1000_9000_71900000_12_1000 tdcountmerge_3_3_1_-1_1000_9000_71900000_12_1000 txcountmerge_3_3_1_1_1000_9000_71900000_12_1000 tycountmerge_3_3_1_1_1000_9000_71900000_12_1000 txcountmerge_3_3_1_-1_1000_9000_71900000_12_1000 tycountmerge_3_3_-1_1_1000_9000_71900000_12_1000 txcountmerge_3_3_-1_-1_1000_9000_71900000_12_1000 tycountmerge_3_3_-1_-1_1000_9000_71900000_12_1000 txcountmerge_3_3_-1_1_1000_9000_71900000_12_1000 tycountmerge_3_3_1_-1_1000_9000_71900000_12_1000 countmerge_3_3_1_1_1000_9000_71900000_12_1000; do test -d arts/shards/$id; grep -q '|ambiguous=0|result=PASS|' arts/shards/$id/run.hbp; cp -r arts/shards/$id sealed/shards/; done
          for id in tacountmerge_3_3_1_1_1000_9000_71900000_12_1000 tdcountmerge_3_3_1_1_1000_9000_71900000_12_1000 tacountmerge_3_3_1_-1_1000_9000_71900000_12_1000 tdcountmerge_3_3_1_-1_1000_9000_71900000_12_1000 txcountmerge_3_3_1_1_1000_9000_71900000_12_1000 tycountmerge_3_3_1_1_1000_9000_71900000_12_1000 txcountmerge_3_3_1_-1_1000_9000_71900000_12_1000 tycountmerge_3_3_-1_1_1000_9000_71900000_12_1000 txcountmerge_3_3_-1_-1_1000_9000_71900000_12_1000 tycountmerge_3_3_-1_-1_1000_9000_71900000_12_1000 txcountmerge_3_3_-1_1_1000_9000_71900000_12_1000 tycountmerge_3_3_1_-1_1000_9000_71900000_12_1000 countmerge_3_3_1_1_1000_9000_71900000_12_1000; do sed "s/^/SHARD|$id|/" arts/shards/$id/run.hbp; done >> seal.hbp
          echo "GITRAM_SEAL|name=3x3-fullspace|part=1/2|counts=13|cells=239|merges=13|status=PASS|json=0" >> seal.hbp
          mv seal.hbp sealed/PART-1.hbp; (cd sealed && sha256sum PART-1.hbp > PART-1.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-part-1
          retention-days: 30
          if-no-files-found: error
          path: sealed
