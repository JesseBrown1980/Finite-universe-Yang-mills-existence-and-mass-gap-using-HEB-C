name: "Y137 certificate atlas exact prediction controls"
on:
  pull_request:
    paths:
      - "docs/certificate-atlas/predictions.py"
      - "docs/certificate-atlas/certificates.json"
      - ".github/workflows/y137-atlas-exact-predictions.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-rational-predictions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check frozen README data SHA and verify repository no-float source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum docs/certificate-atlas/certificates.json | cut -d' ' -f1)" = "a40c19559ac9739610abd4241d1ec9585f23c509f1dfbdfa04e0daa08cb7e0f5"
          python3 -I -B native/scripts/integer_only_audit.py docs/certificate-atlas/predictions.py
      - name: Test four 3x3 intervals, exact Chebyshev enclosure and Feshbach identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/y137-atlas-tests
          python3 -I -B docs/certificate-atlas/predictions.py docs/certificate-atlas/certificates.json | tee build/y137-atlas-tests/RESULT-ATLAS-PREDICTIONS.hbp
          grep -Fq "ATLAS_GAP_VERDICT|higher_r=3_OF_3|r9=MODEL_REJECTED|wrong_44=REJECTED|coefficient_43_high_r=COMPATIBLE|uniform_r9=REJECTED" build/y137-atlas-tests/RESULT-ATLAS-PREDICTIONS.hbp
          grep -Fq "ATLAS_FILTER_TEST|target=OLD_1_OVER_700|degree=15|" build/y137-atlas-tests/RESULT-ATLAS-PREDICTIONS.hbp
          grep -Fq "ATLAS_FESHBACH_TOY|transition=" build/y137-atlas-tests/RESULT-ATLAS-PREDICTIONS.hbp
          grep -Fq "exact_effective_observable=PASS|complete_normalization=PASS|omitted_QOQ=REJECTED|physical_S3_Wilson=NOT_COMPUTED" build/y137-atlas-tests/RESULT-ATLAS-PREDICTIONS.hbp
          grep -Fq "ATLAS_VERDICT|readme_data=SHA_PINNED|retrospective_high_r=3_OF_3|r9=MODEL_REJECTED|Chebyshev_integer_pairs=PASS|Feshbach_toy=PASS|Wilson_weight=HOLD|continuum=OPEN" build/y137-atlas-tests/RESULT-ATLAS-PREDICTIONS.hbp
          test "$(wc -l < build/y137-atlas-tests/RESULT-ATLAS-PREDICTIONS.hbp)" -eq 13
          sha256sum docs/certificate-atlas/predictions.py docs/certificate-atlas/certificates.json build/y137-atlas-tests/RESULT-ATLAS-PREDICTIONS.hbp > build/y137-atlas-tests/SHA256SUMS
          git rev-parse HEAD > build/y137-atlas-tests/COMMIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y137-atlas-prediction-exact-receipt
          path: build/y137-atlas-tests/
          retention-days: 90
          if-no-files-found: warn
