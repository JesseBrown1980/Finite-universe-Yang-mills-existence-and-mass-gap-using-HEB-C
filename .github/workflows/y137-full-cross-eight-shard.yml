name: "Y137 exact 20736x2 old-to-residual Hamiltonian coupling"
on:
  pull_request:
    paths:
      - '.github/workflows/y137-full-cross-eight-shard.yml'
      - 'independent/y137-full-cross-20261116/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coupling-pilot-source-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Audits and strict immutable source pins
        run: |
          set -euo pipefail
          python3 -I -B native/scripts/integer_only_audit.py independent/y137-full-cross-20261116/exact_old_new_coupling.py
          python3 -I -B native/scripts/no_float_gate.py .
          test "$(git hash-object independent/finite_s3_3x4_r9_first_gap.py)" = '91bd1e80cbfcfb76198966aa177d097ecfbe8143'
          test "$(git hash-object independent/y137-h20736-shell3-20261116/sparse_h20736.py)" = 'd0d9d3d14d804450a31ed8e98c01a031b9a53596'
          test "$(git hash-object independent/y137-two-residual-krylov-20261116/RESULT-TWO-RESIDUAL-AND-FOUR-ENVELOPE-20261116.hbp)" = '90f9c002f6fe8df2ecd4b5e725de3f9153fbab10'
      - name: Exact toy controls and forged reverse edge rejection
        run: |
          set -euo pipefail
          python3 -I -B independent/y137-full-cross-20261116/exact_old_new_coupling.py toy | tee /tmp/cross-toy.hbp
          grep -Fq '|forged_reverse=REJECTED|' /tmp/cross-toy.hbp
      - name: Build original 20736 source and pilot 72-move reciprocity
        run: |
          set -euo pipefail
          mkdir -p build/y137-h20736 build/y137-cross-pilot
          python3 -I -B independent/y137-h20736-shell3-20261116/sparse_h20736.py real > build/y137-cross-pilot/ORIGINAL-H20736.hbp
          python3 -I -B independent/y137-full-cross-20261116/exact_old_new_coupling.py pilot | tee build/y137-cross-pilot/ALL-PILOT.hbp
          grep '^Y137_CROSS_PILOT|' build/y137-cross-pilot/ALL-PILOT.hbp > build/y137-cross-pilot/RESULT-PILOT.hbp
          grep -Fq '|full_coupling=NOT_COMPUTED|first_Wilson_weight=HOLD|json=0' build/y137-cross-pilot/RESULT-PILOT.hbp
          git rev-parse HEAD > build/y137-cross-pilot/COMMIT.txt
          sha256sum independent/y137-full-cross-20261116/exact_old_new_coupling.py > build/y137-cross-pilot/SOURCE.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y137-full-cross-original-source-pilot
          path: build/y137-cross-pilot/
          retention-days: 90
          if-no-files-found: warn
  coupling-eight-shards:
    needs: coupling-pilot-source-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        slot: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rebuild original exact sparse 20736 matrix and physical support
        run: |
          set -euo pipefail
          mkdir -p build/y137-h20736 build/y137-cross
          python3 -I -B independent/y137-h20736-shell3-20261116/sparse_h20736.py real > build/y137-cross/ORIGINAL-H20736.hbp
          test -s build/y137-h20736/H20736-SPARSE-UPPER.tsv
      - name: Exact old-support Hamiltonian source rows
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 -I -B independent/y137-full-cross-20261116/exact_old_new_coupling.py shard ${{ matrix.slot }} | tee build/y137-cross/ALL-CROSS-${{ matrix.slot }}.hbp
          grep '^Y137_CROSS_SHARD|' build/y137-cross/ALL-CROSS-${{ matrix.slot }}.hbp > build/y137-cross/RESULT-CROSS-${{ matrix.slot }}.hbp
          test "$(wc -l < build/y137-cross/RESULT-CROSS-${{ matrix.slot }}.hbp)" -eq 1
          grep -Fq '|old_to_new_H=SHARD_EXACT|Wilson_weight=HOLD|json=0' build/y137-cross/RESULT-CROSS-${{ matrix.slot }}.hbp
          test -s build/y137-cross/COUPLING-ROWS-${{ matrix.slot }}.tsv
          git rev-parse HEAD > build/y137-cross/COMMIT.txt
          sha256sum independent/y137-full-cross-20261116/exact_old_new_coupling.py > build/y137-cross/SOURCE.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slice-${{ matrix.slot }}
          path: |
            build/y137-cross/COUPLING-ROWS-${{ matrix.slot }}.tsv
            build/y137-cross/RESULT-CROSS-${{ matrix.slot }}.hbp
            build/y137-cross/COMMIT.txt
            build/y137-cross/SOURCE.sha256
          retention-days: 90
          if-no-files-found: error
  coupling-exact-fanin:
    needs: coupling-eight-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          pattern: slice-*
          path: build/y137-cross-shards/
          merge-multiple: false
      - name: Rebuild independently authenticated original 20736 trial basis
        run: |
          set -euo pipefail
          mkdir -p build/y137-h20736 build/y137-cross-final
          python3 -I -B independent/y137-h20736-shell3-20261116/sparse_h20736.py real > build/y137-cross-final/ORIGINAL-H20736.hbp
      - name: Require all 28634 rows and four exact original Gram bilinears
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 -I -B independent/y137-full-cross-20261116/exact_old_new_coupling.py fanin build/y137-cross-shards | tee build/y137-cross-final/RESULT-CROSS-EXACT.hbp
          grep -Fq '|frozen_Gram_numerator_identities=4_OF_4_PASS|' build/y137-cross-final/RESULT-CROSS-EXACT.hbp
          grep -Fq '|full_old_to_new_H=ACCEPTED_EXACT_20736x2|' build/y137-cross-final/RESULT-CROSS-EXACT.hbp
          grep -Fq '|first_Wilson_weight=HOLD|json=0' build/y137-cross-final/RESULT-CROSS-EXACT.hbp
          test "$(wc -l < build/y137-cross-final/H20736x2-CROSS-EXACT.tsv)" -eq 20736
          git rev-parse HEAD > build/y137-cross-final/COMMIT.txt
          sha256sum build/y137-cross-final/H20736x2-CROSS-EXACT.tsv > build/y137-cross-final/CROSS-MATRIX.sha256
          sha256sum independent/y137-full-cross-20261116/exact_old_new_coupling.py > build/y137-cross-final/SOURCE.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y137-full-20736x2-cross-coupling-exact-fanin
          path: build/y137-cross-final/
          retention-days: 90
          if-no-files-found: warn
