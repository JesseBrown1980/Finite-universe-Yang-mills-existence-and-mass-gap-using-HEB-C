name: Issue 137 lift-free K3 isolation replay
on:
  pull_request:
    paths:
      - 'independent/y137-liftfree-k3-20261113/**'
      - '.github/workflows/y137-liftfree-k3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-k3:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check the prediction seal and the pinned sources
        run: |
          set -euo pipefail
          D=independent/y137-liftfree-k3-20261113
          grep -Fq 'status=FROZEN_BEFORE_THE_REPLAY_RUN' $D/PREDICTION.hbp
          test "$(git hash-object $D/PREDICTION.hbp)" = "9efb5dcc97746f6c4adca13ba38c3d5182274138"
          test "$(sha256sum $D/src155/y137_k3_sector_isolation.py | cut -d' ' -f1)" = "f3461aa8a50cfa9efb4a1bbdc2d7be44ec1d4a13c80c47fd55fa07de60be28ff"
          test "$(git hash-object independent/finite_s3_3x4_r9_first_gap.py)" = "91bd1e80cbfcfb76198966aa177d097ecfbe8143"
          test "$(git hash-object independent/y142-floor-word-search-20261113/RESULT-WORD-SEARCH.hbp)" = "57de51858e6a44dadd51c6e8419a549343145038"
          test "$(sha256sum independent/y142-floor-word-search-20261113/m13/cert_m13_r9_1_f81-54-36-24-16.txt | cut -d' ' -f1)" = "7ad6e19977796ba4ecd321fdd028156fe57ee7ff782a6aef0aedb0a686c4a6b6"
          test "$(sha256sum independent/y131-floor-cert-freeze-v2-20261110/work/design/gate_required.sh | cut -d' ' -f1)" = "0064ca4654aa8725f2040f8b50b01e95a521966eada0ac75ffdf2ee63b98849c"
          test "$(sha256sum independent/y131-floor-cert-freeze-v2-20261110/work/design/py/cert_gate.py | cut -d' ' -f1)" = "6043d0897250a7c873a3c1c553a52a1e38f99046ba5131375fb3f3dddbe02889"
          (cd $D && sha256sum -c SHA256SUMS --quiet)
          python3 -I -X utf8 native/scripts/integer_only_audit.py $D/replay_k3.py $D/check_k3.py $D/dump_k3_matrices.py $D/src155/y137_k3_sector_isolation.py
      - name: Replay the draft K3 isolation with the old and the lift-free floor
        run: |
          set -euo pipefail
          D=independent/y137-liftfree-k3-20261113
          mkdir -p build/y137-liftfree-k3
          python3 -I -B $D/replay_k3.py | tee build/y137-liftfree-k3/replay.stdout.txt
          grep '^LIFT_FREE_K3_' build/y137-liftfree-k3/replay.stdout.txt > build/y137-liftfree-k3/RESULT-K3-LIFTFREE.hbp
          grep '^Y137_K3_' build/y137-liftfree-k3/replay.stdout.txt > build/y137-liftfree-k3/DRAFT-RECEIPT-REPRODUCED.hbp
          cmp build/y137-liftfree-k3/RESULT-K3-LIFTFREE.hbp $D/RESULT-K3-LIFTFREE.hbp
          cmp build/y137-liftfree-k3/DRAFT-RECEIPT-REPRODUCED.hbp $D/DRAFT-RECEIPT-REPRODUCED.hbp
          test "$(sha256sum build/y137-liftfree-k3/DRAFT-RECEIPT-REPRODUCED.hbp | cut -d' ' -f1)" = "cf91b9e4d842698d4972ac8df6ff6210bd3f439f561a354bca2954aac36716ef"
          grep -Fq 'LIFT_FREE_K3_VERDICT|status=ISOLATION_HOLDS_LIFT_FREE|' build/y137-liftfree-k3/RESULT-K3-LIFTFREE.hbp
          test "$(grep -c '^LIFT_FREE_K3_LADDER|' build/y137-liftfree-k3/RESULT-K3-LIFTFREE.hbp || true)" -eq 0
      - name: Independent inertia count from the exact matrices
        run: |
          set -euo pipefail
          D=independent/y137-liftfree-k3-20261113
          python3 -I -B $D/check_k3.py | tee build/y137-liftfree-k3/check.stdout.txt
          test "$(grep -c '^LIFT_FREE_K3_CHECK|.*|agree=1|' build/y137-liftfree-k3/check.stdout.txt)" -eq 3
          grep -Fq 'LIFT_FREE_K3_CHECK_VERDICT|status=PRIMARY_PASS|' build/y137-liftfree-k3/check.stdout.txt
          sha256sum build/y137-liftfree-k3/* > build/y137-liftfree-k3/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y137-liftfree-k3-isolation
          path: build/y137-liftfree-k3/
          retention-days: 30
