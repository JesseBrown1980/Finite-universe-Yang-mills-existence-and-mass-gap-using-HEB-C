name: Issue137 degree11 independently checked REAL shell5 odd-moment source
on:
  pull_request:
    paths:
      - 'independent/y137-d11-mu3-q5-source-probe-20261114/**'
      - '.github/workflows/y137-d11-mu3-real-q5-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-real-Q5-source-rows:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Strict integer/no-float audit of independently authored real Q5 source test
        run: |
          set -euo pipefail
          python3 -I -X utf8 native/scripts/no_float_gate.py .
          python3 -I -X utf8 native/scripts/integer_only_audit.py independent/y137-d11-mu3-q5-source-probe-20261114/q5_source_probe.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 43613345828
          github-token: ${{ github.token }}
          name: y137-d11-v1-actual-Q5-group0
          path: build/y137-q5-real-source
      - name: Independent S3 gauge canonicalization and all 72 raw moves for sampled real Q5 V1 support
        run: |
          set -euo pipefail
          ulimit -v 6291456
          python3 -I -B independent/y137-d11-mu3-q5-source-probe-20261114/q5_source_probe.py | tee build/y137-q5-real-source/REAL-Q5-SOURCE-PROBE.hbp
          grep -Fq 'fully_sha_verified_group0_Q5_targets=435324|audited_Q5_source_rows=128|independently_rebuilt_raw_moves=9216|' build/y137-q5-real-source/REAL-Q5-SOURCE-PROBE.hbp
          grep -Fq 'exact_S3_canonicalization=PASS|original_72_moves_per_row=PASS|W_orbit_size_and_magnetic=PASS|' build/y137-q5-real-source/REAL-Q5-SOURCE-PROBE.hbp
          grep -Fq 'planted_edge_as_selfloop=REFUSED|source_vectors=REAL_SIGNED_E1_E2_V1_OVER_B_SHELL5|' build/y137-q5-real-source/REAL-Q5-SOURCE-PROBE.hbp
          grep -Fq 'whole_Q5_source_completeness=NOT_YET_TESTED|real_mu3=NOT_COMPUTED|' build/y137-q5-real-source/REAL-Q5-SOURCE-PROBE.hbp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y137-d11-real-Q5-independent-source-128
          path: build/y137-q5-real-source/REAL-Q5-SOURCE-PROBE.hbp
          retention-days: 60
          if-no-files-found: ignore
