# 3x3-fullspace stage B part 2/2: 19 counts, 33 cells, 7 merges.
# Generated by native/ym/python/full_space_workflow.py. Every count must report
# ambiguous=0 and result=PASS; split counts are merged by countmerge (input
# integrity, spec, INPUT_MATRIX, exact column partition). Integer-only, json=0.
name: HEB-C YM 3x3-fullspace stage B part 2/2 (33 cells, 7 merges)

on:
  workflow_dispatch:
  push:
    branches: [http0-ym-backend-finite-volumes]
    paths: ['.github/workflows/hebc-ym-3x3-fullspace-stage-b-part2.yml']

permissions:
  contents: read

concurrency:
  group: hebc-ym-3x3-fullspace-stage-b-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cell:
    name: Cell ${{ matrix.id }} ${{ matrix.spec }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: "001", spec: "countcols/3/3/-1/-1/1000/9000/71900000/12/1000/0/60"}
          - {id: "002", spec: "countcols/3/3/-1/-1/1000/9000/71900000/12/1000/60/120"}
          - {id: "003", spec: "countcols/3/3/-1/-1/1000/9000/71900000/12/1000/120/180"}
          - {id: "004", spec: "countcols/3/3/-1/-1/1000/9000/71900000/12/1000/180/240"}
          - {id: "005", spec: "countcols/3/3/-1/-1/1000/9000/71900000/12/1000/240/249"}
          - {id: "006", spec: "tacountcols/3/3/1/1/1000/9000/52533422/12/1000/0/60"}
          - {id: "007", spec: "tacountcols/3/3/1/1/1000/9000/52533422/12/1000/60/120"}
          - {id: "008", spec: "tacountcols/3/3/1/1/1000/9000/52533422/12/1000/120/174"}
          - {id: "009", spec: "tdcountcols/3/3/1/1/1000/9000/52533422/12/1000/0/60"}
          - {id: "010", spec: "tdcountcols/3/3/1/1/1000/9000/52533422/12/1000/60/120"}
          - {id: "011", spec: "tdcountcols/3/3/1/1/1000/9000/52533422/12/1000/120/174"}
          - {id: "012", spec: "countcols/3/3/-1/1/1000/9000/71900000/12/1000/0/60"}
          - {id: "013", spec: "countcols/3/3/-1/1/1000/9000/71900000/12/1000/60/120"}
          - {id: "014", spec: "countcols/3/3/-1/1/1000/9000/71900000/12/1000/120/169"}
          - {id: "015", spec: "countcols/3/3/1/-1/1000/9000/71900000/12/1000/0/60"}
          - {id: "016", spec: "countcols/3/3/1/-1/1000/9000/71900000/12/1000/60/120"}
          - {id: "017", spec: "countcols/3/3/1/-1/1000/9000/71900000/12/1000/120/169"}
          - {id: "018", spec: "txcountcols/3/3/1/1/1000/9000/52533422/12/1000/0/60"}
          - {id: "019", spec: "txcountcols/3/3/1/1/1000/9000/52533422/12/1000/60/117"}
          - {id: "020", spec: "tycountcols/3/3/1/1/1000/9000/52533422/12/1000/0/60"}
          - {id: "021", spec: "tycountcols/3/3/1/1/1000/9000/52533422/12/1000/60/117"}
          - {id: "022", spec: "count/3/3/-1/-1/1000/9000/52533422/12/1000"}
          - {id: "023", spec: "count/3/3/-1/1/1000/9000/52533422/12/1000"}
          - {id: "024", spec: "count/3/3/1/-1/1000/9000/52533422/12/1000"}
          - {id: "025", spec: "count/3/3/1/1/1000/9000/52533422/12/1000"}
          - {id: "026", spec: "tacount/3/3/1/-1/1000/9000/52533422/12/1000"}
          - {id: "027", spec: "tdcount/3/3/1/-1/1000/9000/52533422/12/1000"}
          - {id: "028", spec: "txcount/3/3/-1/-1/1000/9000/52533422/12/1000"}
          - {id: "029", spec: "txcount/3/3/-1/1/1000/9000/52533422/12/1000"}
          - {id: "030", spec: "txcount/3/3/1/-1/1000/9000/52533422/12/1000"}
          - {id: "031", spec: "tycount/3/3/-1/-1/1000/9000/52533422/12/1000"}
          - {id: "032", spec: "tycount/3/3/-1/1/1000/9000/52533422/12/1000"}
          - {id: "033", spec: "tycount/3/3/1/-1/1000/9000/52533422/12/1000"}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: Build offline from vendored sources
        working-directory: native/ym
        run: cargo build --release --offline --locked
      - name: Fresh sector + one job + verify
        working-directory: native/ym
        env:
          HEBC_YM_FRESH: "1"
        run: |
          set -euo pipefail
          B=target/release/hebc_ym_http0; R=$RUNNER_TEMP/root; spec="${{ matrix.spec }}"
          kind=${spec%%/*}
          case $kind in *countcols) mode=${kind%countcols} ;; *count) mode=${kind%count} ;; esac
          sec="${mode}sector/$(echo $spec | cut -d/ -f2-5)"; id=$(echo $spec | tr / _)
          $B job $R $sec
          $B job $R $spec | tee job.txt
          $B verify $R $spec | tee -a job.txt
          grep -q '^HEBC_YM|result=PASS|action=verify|' job.txt
          case $kind in *count) grep -q '|ambiguous=0|result=PASS|' $R/shards/$id/run.hbp ;; esac
          mkdir -p out/shards; cp -r $R/shards/$id out/shards/
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: native/ym/out

  merge:
    name: Merge ${{ matrix.id }} ${{ matrix.spec }}
    needs: cell
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: "m01", spec: "countmerge/3/3/-1/-1/1000/9000/71900000/12/1000"}
          - {id: "m02", spec: "tacountmerge/3/3/1/1/1000/9000/52533422/12/1000"}
          - {id: "m03", spec: "tdcountmerge/3/3/1/1/1000/9000/52533422/12/1000"}
          - {id: "m04", spec: "countmerge/3/3/-1/1/1000/9000/71900000/12/1000"}
          - {id: "m05", spec: "countmerge/3/3/1/-1/1000/9000/71900000/12/1000"}
          - {id: "m06", spec: "txcountmerge/3/3/1/1/1000/9000/52533422/12/1000"}
          - {id: "m07", spec: "tycountmerge/3/3/1/1/1000/9000/52533422/12/1000"}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        if: matrix.spec != 'none'
      - uses: actions/download-artifact@v4
        if: matrix.spec != 'none'
        with:
          pattern: cell-*
          path: cells
          merge-multiple: true
      - name: Toolchain 1.81
        if: matrix.spec != 'none'
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: countmerge + verify
        if: matrix.spec != 'none'
        env:
          HEBC_YM_FRESH: "1"
        run: |
          set -euo pipefail
          (cd native/ym && cargo build --release --offline --locked)
          B=native/ym/target/release/hebc_ym_http0; R=$RUNNER_TEMP/root; spec="${{ matrix.spec }}"
          kind=${spec%%/*}; mode=${kind%countmerge}; rest=${spec#*/}
          cid=$(echo "${mode}count/$rest" | tr / _); id=$(echo $spec | tr / _)
          mkdir -p $R/scol/$cid
          cp -r cells/shards/${mode}countcols_$(echo $rest | tr / _)_* $R/scol/$cid/
          $B job $R "${mode}sector/$(echo $rest | cut -d/ -f1-4)"
          $B job $R $spec | tee job.txt
          $B verify $R $spec | tee -a job.txt
          grep -q '^HEBC_YM|result=PASS|action=verify|' job.txt
          grep -q '|ambiguous=0|result=PASS|' $R/shards/$id/run.hbp
          mkdir -p out/shards; cp -r $R/shards/$id out/shards/
      - uses: actions/upload-artifact@v4
        if: matrix.spec != 'none'
        with:
          name: merge-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: out

  seal:
    name: Seal part 2/2
    needs: [cell, merge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arts
          merge-multiple: true
      - name: Integrity and seal
        run: |
          set -euo pipefail
          test "${{ needs.cell.result }}" = success
          test "${{ needs.merge.result }}" = success
          python3 native/ym/python/verify_shard_integrity.py arts/shards | tee seal.hbp
          grep -q '|failed=0|.*|result=PASS|' seal.hbp
          mkdir -p sealed/shards
          for id in countmerge_3_3_-1_-1_1000_9000_71900000_12_1000 tacountmerge_3_3_1_1_1000_9000_52533422_12_1000 tdcountmerge_3_3_1_1_1000_9000_52533422_12_1000 countmerge_3_3_-1_1_1000_9000_71900000_12_1000 countmerge_3_3_1_-1_1000_9000_71900000_12_1000 txcountmerge_3_3_1_1_1000_9000_52533422_12_1000 tycountmerge_3_3_1_1_1000_9000_52533422_12_1000 count_3_3_-1_-1_1000_9000_52533422_12_1000 count_3_3_-1_1_1000_9000_52533422_12_1000 count_3_3_1_-1_1000_9000_52533422_12_1000 count_3_3_1_1_1000_9000_52533422_12_1000 tacount_3_3_1_-1_1000_9000_52533422_12_1000 tdcount_3_3_1_-1_1000_9000_52533422_12_1000 txcount_3_3_-1_-1_1000_9000_52533422_12_1000 txcount_3_3_-1_1_1000_9000_52533422_12_1000 txcount_3_3_1_-1_1000_9000_52533422_12_1000 tycount_3_3_-1_-1_1000_9000_52533422_12_1000 tycount_3_3_-1_1_1000_9000_52533422_12_1000 tycount_3_3_1_-1_1000_9000_52533422_12_1000; do test -d arts/shards/$id; grep -q '|ambiguous=0|result=PASS|' arts/shards/$id/run.hbp; cp -r arts/shards/$id sealed/shards/; done
          for id in countmerge_3_3_-1_-1_1000_9000_71900000_12_1000 tacountmerge_3_3_1_1_1000_9000_52533422_12_1000 tdcountmerge_3_3_1_1_1000_9000_52533422_12_1000 countmerge_3_3_-1_1_1000_9000_71900000_12_1000 countmerge_3_3_1_-1_1000_9000_71900000_12_1000 txcountmerge_3_3_1_1_1000_9000_52533422_12_1000 tycountmerge_3_3_1_1_1000_9000_52533422_12_1000 count_3_3_-1_-1_1000_9000_52533422_12_1000 count_3_3_-1_1_1000_9000_52533422_12_1000 count_3_3_1_-1_1000_9000_52533422_12_1000 count_3_3_1_1_1000_9000_52533422_12_1000 tacount_3_3_1_-1_1000_9000_52533422_12_1000 tdcount_3_3_1_-1_1000_9000_52533422_12_1000 txcount_3_3_-1_-1_1000_9000_52533422_12_1000 txcount_3_3_-1_1_1000_9000_52533422_12_1000 txcount_3_3_1_-1_1000_9000_52533422_12_1000 tycount_3_3_-1_-1_1000_9000_52533422_12_1000 tycount_3_3_-1_1_1000_9000_52533422_12_1000 tycount_3_3_1_-1_1000_9000_52533422_12_1000; do sed "s/^/SHARD|$id|/" arts/shards/$id/run.hbp; done >> seal.hbp
          echo "GITRAM_SEAL|name=3x3-fullspace|part=2/2|counts=19|cells=33|merges=7|status=PASS|json=0" >> seal.hbp
          mv seal.hbp sealed/PART-2.hbp; (cd sealed && sha256sum PART-2.hbp > PART-2.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-part-2
          retention-days: 30
          if-no-files-found: error
          path: sealed
