# Seal-only re-run of 2x5 stage B (source run 40353983355, head 50d6539575b078c23a6402069d27c82ddd523f7a).
# Generated by native/ym/python/reseal_workflow.py. It launches no cell or merge
# computation. It fetches the source run's 132 artifacts by id, re-checks them against fresh
# API metadata and the frozen manifest, verifies size and raw-ZIP SHA-256 of all of
# them before extracting any (reseal_verify.py), then runs the certify script of the
# fixed generator verbatim. Any failure before the seal is INCONCLUSIVE. json=0
name: HEB-C YM 2x5 stage B re-seal (seal-only, run 40353983355)

on:
  push:
    branches: [ym-2x5b-reseal]
    paths: ['.github/workflows/hebc-ym-2x5-stage-b-reseal.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: hebc-ym-2x5-stage-b-reseal
  cancel-in-progress: false

jobs:
  reseal:
    name: Verify artifacts, certify, seal (no computation)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen manifest and clean-root generator control
        run: |
          set -euo pipefail
          (cd $(dirname native/ym/results/2x5_stage_b_reseal/RESEAL-MANIFEST-40353983355.hbp) && sha256sum -c $(basename native/ym/results/2x5_stage_b_reseal/RESEAL-MANIFEST-40353983355.hbp .hbp).sha256)
          grep -q '^MANIFEST_TOTAL|run=40353983355|head=50d6539575b078c23a6402069d27c82ddd523f7a|artifacts=132|cells=128|merges=4|problems=0|.*|result=PASS|' native/ym/results/2x5_stage_b_reseal/RESEAL-MANIFEST-40353983355.hbp
          bash native/ym/python/reseal_generator_control.sh | tee $RUNNER_TEMP/gen-control.hbp
          grep -q '^GEN_CONTROL_RESULT|result=PASS|' $RUNNER_TEMP/gen-control.hbp
          cp $RUNNER_TEMP/gen-control.hbp gen-control.hbp
      - name: Fetch artifacts by id; fresh metadata must equal the frozen manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R=$GITHUB_REPOSITORY
          for p in 1 2 3; do gh api "repos/$R/actions/runs/40353983355/artifacts?per_page=100&page=$p" -q '.artifacts[]|[.id,.name,.size_in_bytes,.digest,.expired,.workflow_run.id,.workflow_run.head_sha]|@tsv'; done > fresh.tsv
          python3 native/ym/python/reseal_manifest.py fresh.tsv .github/workflows/hebc-ym-2x5-stage-b-r9.yml 40353983355 50d6539575b078c23a6402069d27c82ddd523f7a 128 4 > fresh-manifest.hbp
          cmp fresh-manifest.hbp native/ym/results/2x5_stage_b_reseal/RESEAL-MANIFEST-40353983355.hbp
          mkdir zips
          for id in $(grep '^MANIFEST|' native/ym/results/2x5_stage_b_reseal/RESEAL-MANIFEST-40353983355.hbp | sed -E 's/.*\|artifact_id=([0-9]+)\|.*/\1/'); do
            gh api "repos/$R/actions/artifacts/$id/zip" > zips/$id.zip
          done
          echo "RESEAL_FETCH|zips=$(ls zips | wc -l)|json=0"
      - name: Verify all artifacts before any extraction (all-or-nothing)
        run: |
          set -euo pipefail
          python3 native/ym/python/reseal_verify.py native/ym/results/2x5_stage_b_reseal/RESEAL-MANIFEST-40353983355.hbp zips arts 128 4 | tee reseal-verify.hbp
          grep -q '^RESEAL_VERIFY_TOTAL|artifacts=132|result=PASS|' reseal-verify.hbp
      - name: Certify and seal
        run: |
          set -euo pipefail
          shopt -s nullglob
          P=native/ym/python
          n=$(ls -d arts/shards/count_* arts/shards/countcols_* arts/shards/countmerge_* 2>/dev/null | wc -l); echo "shards=$n expected=132"
          test "$n" -eq 132
          python3 $P/verify_shard_integrity.py arts/shards | tee seal.hbp
          grep -q '|failed=0|.*|result=PASS|' seal.hbp
          (cd $(dirname native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp) && sha256sum -c HEBC-YM-2X5-STAGE-A.sha256)
          # the ray's E8 bound comes from flatcomp in the sealed stage A receipt
          u=60; fl="$u"; for k in 2 3 4 5 6 7; do fl="$fl,$u"; done
          grep -q "^SHARD|flatcomp_2_5_1_1|FLATCOMP|.*|flat_states=7|flat_electric_diag=\[$fl\]|flat_diag_max=$u|flat_flat_couplings=0|" native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp
          grep -q "^SHARD|flatcomp_2_5_-1_-1|FLATCOMP|.*|flat_states=1|flat_electric_diag=\[$u\]|flat_diag_max=$u|flat_flat_couplings=0|" native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp
          [ "$(grep -c "^SHARD|flatcomp_2_5_.*|FLATCOMP|.*|flat_states=0|.*|flat_flat_couplings=0|" native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp)" = 2 ]
          grep '^SHARD|cluster_' native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp | sed -E 's/^SHARD\|cluster_2_5_(-?1)_(-?1)_1_([0-9]+)_12_4\|CLUSTER/YM2X5_S\1_\2_r\3_CLUSTER/' > clusters.hbp
          cat arts/shards/count_*/run.hbp arts/shards/countmerge_*/run.hbp 2>/dev/null > counts.hbp
          for r in 9; do python3 $P/shell_gap_cert.py --lattice 2x5 clusters.hbp $r counts.hbp; done | tee -a seal.hbp
          python3 $P/monotone_cells.py --lattice 2x5 --ray 60000000 seal.hbp | tee -a seal.hbp
          g=$(grep -c '^SHELL_GAP_CERT|.*|result=PASS|' seal.hbp); r=$(grep -c '^MONOTONE_CELLS|.*|result=PASS|' seal.hbp)
          if [ "$g" = 1 ] && [ "$r" = 1 ]; then st=PASS; else st=FAIL; fi
          # provenance of every merged count: its input shards and matrix
          for f in arts/shards/countmerge_*/run.hbp; do grep -h -e '^MERGE_INPUT|' -e '^INPUT_MATRIX|' $f | sed "s#^#$(basename $(dirname $f))|#" >> seal.hbp; done
          cat arts/shards/*/run.anchor >> seal.hbp
          echo "GITRAM_SEAL|lattice=2x5|couplings=9|gap_certs=$g/1|ray_E8_upper=60000000/1000000|status=$st|json=0" >> seal.hbp
          # bind the seal to everything it used
          echo "RESEAL|source_run=40353983355|source_head=50d6539575b078c23a6402069d27c82ddd523f7a|workflow_commit=$GITHUB_SHA|reseal_run=$GITHUB_RUN_ID|json=0" >> seal.hbp
          echo "RESEAL_MANIFEST|file=native/ym/results/2x5_stage_b_reseal/RESEAL-MANIFEST-40353983355.hbp|sha256=$(sha256sum native/ym/results/2x5_stage_b_reseal/RESEAL-MANIFEST-40353983355.hbp | cut -c1-64)|json=0" >> seal.hbp
          echo "RESEAL_STAGE_A|sha256=$(sha256sum native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp | cut -c1-64)|json=0" >> seal.hbp
          echo "RESEAL_GENERATOR|stage_b_workflow_py_sha256=$(sha256sum native/ym/python/stage_b_workflow.py | cut -c1-64)|generator_commit=$(git log -1 --format=%H -- native/ym/python/stage_b_workflow.py)|json=0" >> seal.hbp
          cat reseal-verify.hbp gen-control.hbp >> seal.hbp
          grep "^MANIFEST|" native/ym/results/2x5_stage_b_reseal/RESEAL-MANIFEST-40353983355.hbp | cut -d"|" -f2-3 | sed "s/^/RESEAL_ARTIFACT|/" >> seal.hbp
          mv seal.hbp HEBC-YM-2X5-STAGE-B.hbp; sha256sum HEBC-YM-2X5-STAGE-B.hbp > HEBC-YM-2X5-STAGE-B.sha256
          test "$st" = PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-hebc-ym-2x5-stage-b-reseal
          if-no-files-found: ignore
          path: |
            HEBC-YM-2X5-STAGE-B.*
            reseal-verify.hbp
            gen-control.hbp
            fresh.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-zips-40353983355
          if-no-files-found: ignore
          retention-days: 90
          path: zips
