      - name: Toolchain 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: Build offline from vendored sources
        working-directory: native/ym
        run: cargo build --release --offline --locked
      - name: Fresh sector + one job + verify
        working-directory: native/ym
        env:
          HEBC_YM_FRESH: "1"
        run: |
          set -euo pipefail
          B=target/release/hebc_ym_http0; R=$RUNNER_TEMP/root; spec="${{ matrix.spec }}"
          sec="sector/$(echo $spec | cut -d/ -f2-5)"; id=$(echo $spec | tr / _)
          $B job $R $sec
          $B job $R $spec | tee job.txt
          $B verify $R $spec | tee -a job.txt
          grep -q '^HEBC_YM|result=PASS|action=verify|' job.txt
          case $spec in count/*) grep -q '|ambiguous=0|result=PASS|' $R/shards/$id/run.hbp ;; esac
          mkdir -p out/shards; cp -r $R/shards/$id out/shards/
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: native/ym/out

  merge:
    name: Merge ${{ matrix.id }} ${{ matrix.spec }}
    needs: cell
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: "m01", spec: "countmerge/2/5/1/1/1000/9000/81778000/12/1000"}
          - {id: "m02", spec: "countmerge/2/5/-1/-1/1000/9000/81778000/12/1000"}
          - {id: "m03", spec: "countmerge/2/5/1/-1/1000/9000/81778000/12/1000"}
          - {id: "m04", spec: "countmerge/2/5/-1/1/1000/9000/81778000/12/1000"}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        if: matrix.spec != 'none'
      - uses: actions/download-artifact@v4
        if: matrix.spec != 'none'
        with:
          pattern: cell-*
          path: cells
          merge-multiple: true
      - name: Toolchain 1.81
        if: matrix.spec != 'none'
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: countmerge + verify
        if: matrix.spec != 'none'
        env:
          HEBC_YM_FRESH: "1"
        run: |
          set -euo pipefail
          (cd native/ym && cargo build --release --offline --locked)
          B=native/ym/target/release/hebc_ym_http0; R=$RUNNER_TEMP/root; spec="${{ matrix.spec }}"
          cid=$(echo $spec | sed 's#^countmerge/#count/#' | tr / _); id=$(echo $spec | tr / _)
          mkdir -p $R/scol/$cid
          cp -r cells/shards/countcols_${cid#count_}_* $R/scol/$cid/
          $B job $R "sector/$(echo $spec | cut -d/ -f2-5)"
          $B job $R $spec | tee job.txt
          $B verify $R $spec | tee -a job.txt
          grep -q '^HEBC_YM|result=PASS|action=verify|' job.txt
          grep -q '|ambiguous=0|result=PASS|' $R/shards/$id/run.hbp
          mkdir -p out/shards; cp -r $R/shards/$id out/shards/
      - uses: actions/upload-artifact@v4
        if: matrix.spec != 'none'
        with:
          name: merge-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: out

  certify:
    name: Integrity, certificates, one-point ray, seal
    needs: [cell, merge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arts
          merge-multiple: true
      - name: Certify and seal
        run: |
          set -euo pipefail
          shopt -s nullglob
          P=native/ym/python
          test "${{ needs.cell.result }}" = success
          test "${{ needs.merge.result }}" = success
          n=$(ls -d arts/shards/count_* arts/shards/countcols_* arts/shards/countmerge_* 2>/dev/null | wc -l); echo "shards=$n expected=132"
          test "$n" -eq 132
          python3 $P/verify_shard_integrity.py arts/shards | tee seal.hbp
          grep -q '|failed=0|.*|result=PASS|' seal.hbp
          (cd $(dirname native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp) && sha256sum -c $(basename native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp).sha256)
          # the ray's E8 bound comes from flatcomp in the sealed stage A receipt
          u=60; fl="$u"; for k in 2 3 4 5 6 7; do fl="$fl,$u"; done
          grep -q "^SHARD|flatcomp_2_5_1_1|FLATCOMP|.*|flat_states=7|flat_electric_diag=\[$fl\]|flat_diag_max=$u|flat_flat_couplings=0|" native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp
          grep -q "^SHARD|flatcomp_2_5_-1_-1|FLATCOMP|.*|flat_states=1|flat_electric_diag=\[$u\]|flat_diag_max=$u|flat_flat_couplings=0|" native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp
          [ "$(grep -c "^SHARD|flatcomp_2_5_.*|FLATCOMP|.*|flat_states=0|.*|flat_flat_couplings=0|" native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp)" = 2 ]
          grep '^SHARD|cluster_' native/ym/results/2x5_stage_a/HEBC-YM-2X5-STAGE-A.hbp | sed -E 's/^SHARD\|cluster_2_5_(-?1)_(-?1)_1_([0-9]+)_12_4\|CLUSTER/YM2X5_S\1_\2_r\3_CLUSTER/' > clusters.hbp
          cat arts/shards/count_*/run.hbp arts/shards/countmerge_*/run.hbp 2>/dev/null > counts.hbp
          for r in 9; do python3 $P/shell_gap_cert.py --lattice 2x5 clusters.hbp $r counts.hbp; done | tee -a seal.hbp
          python3 $P/monotone_cells.py --lattice 2x5 --ray 60000000 seal.hbp | tee -a seal.hbp
          g=$(grep -c '^SHELL_GAP_CERT|.*|result=PASS|' seal.hbp); r=$(grep -c '^MONOTONE_CELLS|.*|result=PASS|' seal.hbp)
          if [ "$g" = 1 ] && [ "$r" = 1 ]; then st=PASS; else st=FAIL; fi
          # provenance of every merged count: its input shards and matrix
          for f in arts/shards/countmerge_*/run.hbp; do grep -h -e '^MERGE_INPUT|' -e '^INPUT_MATRIX|' $f | sed "s#^#$(basename $(dirname $f))|#" >> seal.hbp; done
          cat arts/shards/*/run.anchor >> seal.hbp
          echo "GITRAM_SEAL|lattice=2x5|couplings=9|gap_certs=$g/1|ray_E8_upper=60000000/1000000|status=$st|json=0" >> seal.hbp
          mv seal.hbp HEBC-YM-2X5-STAGE-B.hbp; sha256sum HEBC-YM-2X5-STAGE-B.hbp > HEBC-YM-2X5-STAGE-B.sha256
          test "$st" = PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-hebc-ym-2x5-stage-b
          retention-days: 30
          if-no-files-found: error
          path: HEBC-YM-2X5-STAGE-B.*
