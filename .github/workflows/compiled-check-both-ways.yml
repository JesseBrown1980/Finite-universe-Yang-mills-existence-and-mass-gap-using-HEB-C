# One source built with the base commit's manifests and with this branch's, compared on the recorded rows on Linux, where those rows were made. Evidence for the manifest change, run on this branch only. Integer only, json=0.
name: Compiled check, the same rows built both ways

on:
  workflow_dispatch:
  push:
    branches: [compiled-check-20261104]
    paths:
      - 'native/ym/results/compiled-check-20261104/replay_both_ways.py'

permissions:
  contents: read

jobs:
  both-ways:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal --component clippy
      - name: Built both ways, with the lock files and the vendor folder read after
        run: python3 -I -X utf8 native/ym/results/compiled-check-20261104/replay_both_ways.py build 7ae2806348d1f3638ac8a3ab4588ff4d10694c99
      - name: The recorded rows, both ways
        run: |
          set -euo pipefail
          python3 -I -X utf8 native/ym/results/compiled-check-20261104/replay_both_ways.py run 7ae2806348d1f3638ac8a3ab4588ff4d10694c99 | tee /tmp/both.hbp
          grep -q '^BOTH_WAYS_DONE|failed=0|' /tmp/both.hbp
      - name: The workspace's own tests, clippy and play certificate, as native-rust.yml runs them on a pull request
        working-directory: native/ym
        run: |
          set -euo pipefail
          cargo +1.81.0 test --release --all-targets --offline --locked
          cargo +1.81.0 clippy --release --all-targets --offline --locked -- -D warnings
          cargo +1.81.0 build --release --offline --locked
          scripts/play_certificate.sh target/release "$RUNNER_TEMP/pc" 2:2:1:1:2:23746649,46576000 2:2:-1:-1:2:23746649,46576000 2:3:1:1:3:35498860,58498000 | tee play-cert
          grep -q '^PLAY_CERTIFICATE|.*|result=PASS|' play-certificate.hbp
          independent/test_collect.sh
