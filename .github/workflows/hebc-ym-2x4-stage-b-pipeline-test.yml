# Stage B for the 2x4 finite volume at r = 9, generated by
# native/ym/python/stage_b_workflow.py from the sealed stage A receipt
# native/ym/results/2x4_stageB_pipeline_test/LOCAL-2X4-STAGE-A.hbp (accepted by stage_b_specs.py). Thresholds by the fixed rule; counts
# with core > 100 are split into countcols cells of 50 columns and merged
# by countmerge (input integrity, spec, INPUT_MATRIX, exact column partition).
# Every count must report ambiguous=0 and result=PASS. Integer-only, json=0.
name: HEB-C YM 2x4 stage B r=9 (19 cells, 3 merges)

on:
  workflow_dispatch:
  push:
    branches: [http0-ym-backend-finite-volumes]
    paths: ['.github/workflows/hebc-ym-2x4-stage-b-pipeline-test.yml']

permissions:
  contents: read

concurrency:
  group: hebc-ym-2x4-stage-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cell:
    name: Cell ${{ matrix.id }} ${{ matrix.spec }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: "001", spec: "count/2/4/1/1/1000/9000/45961437/13/10"}
          - {id: "002", spec: "count/2/4/1/1/1000/9000/46418608/13/10"}
          - {id: "003", spec: "count/2/4/-1/-1/1000/9000/46418608/13/10"}
          - {id: "004", spec: "count/2/4/1/1/1000/9000/47331489/12/1000"}
          - {id: "005", spec: "count/2/4/-1/-1/1000/9000/47331489/12/1000"}
          - {id: "006", spec: "countcols/2/4/1/1/1000/9000/70165000/12/1000/0/50"}
          - {id: "007", spec: "countcols/2/4/1/1/1000/9000/70165000/12/1000/50/100"}
          - {id: "008", spec: "countcols/2/4/1/1/1000/9000/70165000/12/1000/100/150"}
          - {id: "009", spec: "countcols/2/4/1/1/1000/9000/70165000/12/1000/150/200"}
          - {id: "010", spec: "countcols/2/4/1/1/1000/9000/70165000/12/1000/200/250"}
          - {id: "011", spec: "countcols/2/4/1/1/1000/9000/70165000/12/1000/250/300"}
          - {id: "012", spec: "countcols/2/4/1/1/1000/9000/70165000/12/1000/300/333"}
          - {id: "013", spec: "countcols/2/4/-1/-1/1000/9000/70165000/12/1000/0/50"}
          - {id: "014", spec: "countcols/2/4/-1/-1/1000/9000/70165000/12/1000/50/100"}
          - {id: "015", spec: "countcols/2/4/-1/-1/1000/9000/70165000/12/1000/100/134"}
          - {id: "016", spec: "countcols/2/4/1/-1/1000/9000/70165000/12/1000/0/50"}
          - {id: "017", spec: "countcols/2/4/1/-1/1000/9000/70165000/12/1000/50/100"}
          - {id: "018", spec: "countcols/2/4/1/-1/1000/9000/70165000/12/1000/100/120"}
          - {id: "019", spec: "count/2/4/-1/1/1000/9000/70165000/12/1000"}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: Build offline from vendored sources
        working-directory: native/ym
        run: cargo build --release --offline --locked
      - name: Fresh sector + one job + verify
        working-directory: native/ym
        env:
          HEBC_YM_FRESH: "1"
        run: |
          set -euo pipefail
          B=target/release/hebc_ym_http0; R=$RUNNER_TEMP/root; spec="${{ matrix.spec }}"
          sec="sector/$(echo $spec | cut -d/ -f2-5)"; id=$(echo $spec | tr / _)
          $B job $R $sec
          $B job $R $spec | tee job.txt
          $B verify $R $spec | tee -a job.txt
          grep -q '^HEBC_YM|result=PASS|action=verify|' job.txt
          case $spec in count/*) grep -q '|ambiguous=0|result=PASS|' $R/shards/$id/run.hbp ;; esac
          mkdir -p out/shards; cp -r $R/shards/$id out/shards/
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: native/ym/out

  merge:
    name: Merge ${{ matrix.id }} ${{ matrix.spec }}
    needs: cell
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: "m01", spec: "countmerge/2/4/1/1/1000/9000/70165000/12/1000"}
          - {id: "m02", spec: "countmerge/2/4/-1/-1/1000/9000/70165000/12/1000"}
          - {id: "m03", spec: "countmerge/2/4/1/-1/1000/9000/70165000/12/1000"}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        if: matrix.spec != 'none'
      - uses: actions/download-artifact@v4
        if: matrix.spec != 'none'
        with:
          pattern: cell-*
          path: cells
          merge-multiple: true
      - name: Toolchain 1.81
        if: matrix.spec != 'none'
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: countmerge + verify
        if: matrix.spec != 'none'
        env:
          HEBC_YM_FRESH: "1"
        run: |
          set -euo pipefail
          (cd native/ym && cargo build --release --offline --locked)
          B=native/ym/target/release/hebc_ym_http0; R=$RUNNER_TEMP/root; spec="${{ matrix.spec }}"
          cid=$(echo $spec | sed 's#^countmerge/#count/#' | tr / _); id=$(echo $spec | tr / _)
          mkdir -p $R/scol/$cid
          cp -r cells/shards/countcols_${cid#count_}_* $R/scol/$cid/
          $B job $R "sector/$(echo $spec | cut -d/ -f2-5)"
          $B job $R $spec | tee job.txt
          $B verify $R $spec | tee -a job.txt
          grep -q '^HEBC_YM|result=PASS|action=verify|' job.txt
          grep -q '|ambiguous=0|result=PASS|' $R/shards/$id/run.hbp
          mkdir -p out/shards; cp -r $R/shards/$id out/shards/
      - uses: actions/upload-artifact@v4
        if: matrix.spec != 'none'
        with:
          name: merge-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: out

  certify:
    name: Integrity, certificates, one-point ray, seal
    needs: [cell, merge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arts
          merge-multiple: true
      - name: Certify and seal
        run: |
          set -euo pipefail
          shopt -s nullglob
          P=native/ym/python
          test "${{ needs.cell.result }}" = success
          test "${{ needs.merge.result }}" = success
          n=$(ls -d arts/shards/count_* arts/shards/countcols_* arts/shards/countmerge_* 2>/dev/null | wc -l); echo "shards=$n expected=22"
          test "$n" -eq 22
          python3 $P/verify_shard_integrity.py arts/shards | tee seal.hbp
          grep -q '|failed=0|.*|result=PASS|' seal.hbp
          (cd $(dirname native/ym/results/2x4_stageB_pipeline_test/LOCAL-2X4-STAGE-A.hbp) && sha256sum -c $(basename native/ym/results/2x4_stageB_pipeline_test/LOCAL-2X4-STAGE-A.hbp).sha256)
          grep '^SHARD|cluster_' native/ym/results/2x4_stageB_pipeline_test/LOCAL-2X4-STAGE-A.hbp | sed -E 's/^SHARD\|cluster_2_4_(-?1)_(-?1)_1_([0-9]+)_12_4\|CLUSTER/YM2X4_S\1_\2_r\3_CLUSTER/' > clusters.hbp
          cat arts/shards/count_*/run.hbp arts/shards/countmerge_*/run.hbp 2>/dev/null > counts.hbp
          for r in 9; do python3 $P/shell_gap_cert.py --lattice 2x4 clusters.hbp $r counts.hbp; done | tee -a seal.hbp
          python3 $P/monotone_cells.py --lattice 2x4 --ray 48000000 seal.hbp | tee -a seal.hbp
          g=$(grep -c '^SHELL_GAP_CERT|.*|result=PASS|' seal.hbp); r=$(grep -c '^MONOTONE_CELLS|.*|result=PASS|' seal.hbp)
          if [ "$g" = 1 ] && [ "$r" = 1 ]; then st=PASS; else st=FAIL; fi
          cat arts/shards/*/run.anchor >> seal.hbp
          echo "GITRAM_SEAL|lattice=2x4|couplings=9|gap_certs=$g/1|ray_E8_upper=48000000/1000000|status=$st|json=0" >> seal.hbp
          mv seal.hbp HEBC-YM-2X4-STAGE-B.hbp; sha256sum HEBC-YM-2X4-STAGE-B.hbp > HEBC-YM-2X4-STAGE-B.sha256
          test "$st" = PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-hebc-ym-2x4-stage-b
          retention-days: 30
          if-no-files-found: error
          path: HEBC-YM-2X4-STAGE-B.*
