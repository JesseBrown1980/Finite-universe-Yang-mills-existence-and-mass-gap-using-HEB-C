name: Hybrid no-store certificate, tori of 33 to 48 plaquettes with the widened copies (hosted cells)

on:
  push:
    branches: [local-fable52-hybrid-batch-20261115]
    paths:
      - independent/hybrid-batch-20261115/TRIGGER-WIDE.txt

permissions:
  contents: read

jobs:
  point:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        args:
          - "6 6 9 11"
          - "6 6 9 13"
          - "6 6 10 11"
          - "6 6 12 11"
          - "4 7 9 13"
          - "4 8 9 13"
          - "5 7 9 11"
          - "5 8 9 11"
          - "6 7 12 11"
          - "6 8 12 10"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rust 1.81 and the two programs
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component clippy
          V=native/ym/results/3x4_stream/perron/vector
          sha256sum $V/review-opus55/review/src/bin/ritz.rs native/ym/crates/evolvers/src/bin/hybridcheck.rs $V/local_table.py independent/hybrid-batch-20261115/point.sh
          # the reader's crate builds from a copy outside the workspace root, as its report says
          cp -r $V/review-opus55/review /tmp/review
          # widened copies (u128 plaquette pattern, up to 48 plaquettes); the originals stay as they are
          sha256sum independent/hybrid-batch-20261115/widen.py
          python3 -I independent/hybrid-batch-20261115/widen.py $V/review-opus55/review/src/bin/ritz.rs /tmp/review/src/bin/ritz.rs native/ym/crates/evolvers/src/bin/hybridcheck.rs native/ym/crates/evolvers/src/bin/hybridcheck_wide.rs
          (cd /tmp/review && cargo +1.81.0 build --release --bin ritz)
          (cd native/ym && cargo +1.81.0 build --release -p evolvers --bin hybridcheck_wide)
      - name: instrument gate, 4x4 at r = 9, cut 10
        run: |
          mkdir -p /tmp/gate && cd /tmp/gate
          bash $GITHUB_WORKSPACE/independent/hybrid-batch-20261115/point.sh 4 4 9 10 3 /tmp/review/target/release/ritz $GITHUB_WORKSPACE/native/ym/target/release/hybridcheck_wide $GITHUB_WORKSPACE/native/ym/results/3x4_stream/perron/vector/local_table.py | tee gate.txt
          python3 -I - <<'PY'
          row = [l for l in open('gate.txt') if l.startswith('POINT|')][-1]
          d = dict(kv.split('=', 1) for kv in row.strip().split('|')[1:] if '=' in kv)
          # registered: cut 10 certificate 115.534179 (py_hybrid_recheck), E9 <= 117.580284; this script measured 116.216456 before the batch
          assert d['certificate_checked'] == '1' and 115534179 <= int(d['E9_lower_micro']) <= 117580284, d
          print('GATE|4x4_r9_cut10_checked_and_between_the_registered_values=1|equal_to_the_original_tools_116216456=%d|json=0' % int(int(d['E9_lower_micro']) == 116216456))
          PY
      - name: the point
        run: |
          mkdir -p /tmp/run && cd /tmp/run
          nproc; free -m | head -2
          /usr/bin/time -v bash $GITHUB_WORKSPACE/independent/hybrid-batch-20261115/point.sh ${{ matrix.args }} 3 /tmp/review/target/release/ritz $GITHUB_WORKSPACE/native/ym/target/release/hybridcheck_wide $GITHUB_WORKSPACE/native/ym/results/3x4_stream/perron/vector/local_table.py 2> time.txt | tee rows.hbp
          grep -E "Elapsed|Maximum resident" time.txt | tee -a rows.hbp
          grep -q "^POINT|" rows.hbp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-${{ strategy.job-index }}
          path: /tmp/run/rows.hbp
