# The integer tools the no-float gate's own job does not carry: the integer pair against CPython's class, the integer copies regenerated byte-exact, the redone items, the division check, and floats planted in files the list names.
# no_float.yml runs the gate, its selftest and its plants. Integer only, json=0.
name: Integer tools

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, integer-pairs-20261103]

permissions:
  contents: read

jobs:
  integer-tools:
    # ubuntu-24.04 keeps python3 at 3.12, which make_integer_pairs.py needs for positions inside f-strings.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The integer pair against CPython's class, every planted break seen, and its integer power
        run: |
          set -euo pipefail
          python3 -I -X utf8 native/scripts/test_intpair.py 27 20000
          python3 -I -X utf8 native/scripts/test_intpair.py --teeth
          python3 -I -X utf8 native/scripts/test_intpair.py --int-power
          python3 -I -X utf8 native/scripts/test_intpair.py --integer-sample
      - name: Every integer copy regenerates byte-exact from its original, and reads clean
        run: |
          set -euo pipefail
          python3 -I -X utf8 native/scripts/make_integer_pairs.py --selftest
          python3 -I -X utf8 native/scripts/make_integer_pairs.py . --check | tee /tmp/copies.out
          grep -q '^INTEGER_COPIES_DONE|copies=25|divisions_to_qdiv=35|differ=0|' /tmp/copies.out
          H=native/ym/results/integer-pairs-2026-11-03
          python3 -I -X utf8 native/scripts/integer_only_audit.py --selftest
          python3 -I -X utf8 native/scripts/integer_only_audit.py native/scripts/intpair.py native/scripts/make_integer_pairs.py "$H/run_cases.py" "$H/run_original_redirected.py" "$H/check_climb_estimate.py" "$H/test_runlog.py" "$H/check_test_c_integer.py" native/ym/results/z-one-matrix-20261030/curve_ABC/C/test_c_integer.py
      - name: The redone items, in integers
        run: |
          set -euo pipefail
          P=native/ym/results/3x4_stream/perron
          python3 -I -X utf8 native/ym/independent/gpt6_3x4_meta_check_integer.py
          python3 -I -X utf8 "$P/warmcal_integer.py" "$P/WARMCAL-small.hbp"
          python3 -I -X utf8 native/scripts/integer_only_audit.py native/ym/independent/gpt6_3x4_meta_check_integer.py "$P/warmcal_integer.py"
      - name: The division check goes red on a float
        run: |
          printf 'x = 1 / 2\n' > /tmp/plant.py
          rc=0
          python3 -I -X utf8 native/ym/results/3x4_stream/perron/second-seat/integer-redo/checked_division.py /tmp/plant.py || rc=$?
          test "$rc" = 3
      - name: A float in a listed file goes red for its count and pin, and a struct or json float goes red by its format or pin
        run: |
          set -euo pipefail
          gate=native/scripts/no_float_gate.py
          # An expected failure: exit 1, and each reason in the output.
          red() {
            rc=0
            python3 -I -X utf8 "$gate" . > /tmp/plant.out || rc=$?
            if [ "$rc" != 1 ]; then echo "the gate gave rc=$rc, wanted red"; cat /tmp/plant.out; exit 1; fi
            for reason in "$@"; do
              if ! grep -qF -- "$reason" /tmp/plant.out; then echo "red for another reason, wanted: $reason"; cat /tmp/plant.out; exit 1; fi
            done
          }
          plant() {
            printf '%s\n' "$2" >> "$1"
            git add "$1"
            shift 2
            red "$@"
          }
          restore() {
            git checkout -q HEAD -- "$1"
          }
          # One more float in a listed file: its count and its pin both move.
          file=native/ym/results/3x4_stream/perron/warmcal.py
          plant "$file" 'y = 1.5' "count_moved=$file" "pin_moved=$file"
          restore "$file"
          # A float by struct's format, in a file with no row and in another, where the import alone reads clean.
          file=native/ym/results/3x4_stream/perron/second-seat/ownlib.py
          plant "$file" 'x = struct.unpack("<d", b"12345678")' "file=$file"
          restore "$file"
          file=native/ym/results/3x4_stream/perron/check_d.py
          plant "$file" 'x = struct.pack("<f", 1)' "file=$file"
          restore "$file"
          # A float through json in the listed file that imports it: the count holds and the pin moves.
          file=native/ym/python/certify_timing.py
          plant "$file" 'x = json.loads("1.5")' "pin_moved=$file"
          restore "$file"
          python3 -I -X utf8 "$gate" . | tail -1
