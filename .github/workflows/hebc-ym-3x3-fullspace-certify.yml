# 3x3-fullspace certify: the N-Nest tree over the sealed stage B parts (runs 40392589541, 40392589603).
# Generated by native/ym/python/full_space_certify_workflow.py from CERTIFY-SPEC.md.
# Depth 4 sectors rebuilt, depth 2 finals re-executed, depth 3 cells checked by hash plus a
# hash-selected sample re-executed, depths 1 and 0 recomputed; every job through HTTP-0.
name: HEB-C YM 3x3-fullspace certify

on:
  workflow_dispatch:
  push:
    branches: [ym-3x3-certify]
    paths: ['.github/workflows/hebc-ym-3x3-fullspace-certify.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: hebc-ym-3x3-fullspace-certify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit every stage B artifact (all-or-nothing, before any use)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Frozen manifests, fresh metadata, fetch by artifact id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          R=$GITHUB_REPOSITORY
          get() { local n=0; until gh api "$1" "${@:2}" > "$RUNNER_TEMP/get.out"; do n=$((n+1)); [ $n -ge 6 ] && return 1; sleep $((n*n*5)); done; cat "$RUNNER_TEMP/get.out"; }
          (cd $(dirname native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART1.hbp) && sha256sum -c $(basename native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART1.hbp .hbp).sha256)
          (cd $(dirname native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART2.hbp) && sha256sum -c $(basename native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART2.hbp .hbp).sha256)
          mkdir -p zips/1
          for p in 1 2 3 4; do get "repos/$R/actions/runs/40392589541/artifacts?per_page=100&page=$p" -q '.artifacts[]|[.id,.name,.size_in_bytes,.digest,.expired,.workflow_run.id,.workflow_run.head_sha]|@tsv'; done > fresh-1.tsv
          head=$(grep '^CMANIFEST_TOTAL|' native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART1.hbp | sed -E 's/.*\|head=([0-9a-f]+)\|.*/\1/')
          python3 native/ym/python/certify_admit.py manifest .github/workflows/hebc-ym-3x3-fullspace-stage-b-part1.yml 40392589541 $head 1 fresh-1.tsv > fresh-1.hbp
          cmp fresh-1.hbp native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART1.hbp
          for id in $(grep '^CMANIFEST|' native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART1.hbp | sed -E 's/.*\|artifact_id=([0-9]+)\|.*/\1/'); do get "repos/$R/actions/artifacts/$id/zip" > zips/1/$id.zip; done
          mkdir -p zips/2
          for p in 1 2 3 4; do get "repos/$R/actions/runs/40392589603/artifacts?per_page=100&page=$p" -q '.artifacts[]|[.id,.name,.size_in_bytes,.digest,.expired,.workflow_run.id,.workflow_run.head_sha]|@tsv'; done > fresh-2.tsv
          head=$(grep '^CMANIFEST_TOTAL|' native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART2.hbp | sed -E 's/.*\|head=([0-9a-f]+)\|.*/\1/')
          python3 native/ym/python/certify_admit.py manifest .github/workflows/hebc-ym-3x3-fullspace-stage-b-part2.yml 40392589603 $head 2 fresh-2.tsv > fresh-2.hbp
          cmp fresh-2.hbp native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART2.hbp
          for id in $(grep '^CMANIFEST|' native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART2.hbp | sed -E 's/.*\|artifact_id=([0-9]+)\|.*/\1/'); do get "repos/$R/actions/artifacts/$id/zip" > zips/2/$id.zip; done
      - name: Admit (phases 1, 2a, 2b)
        run: |
          set -euo pipefail
          python3 native/ym/python/certify_admit.py admit adm 272 20 32 native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART1.hbp zips/1 native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART2.hbp zips/2 | tee admit.hbp
          grep -q '^ADMIT_TOTAL|.*|result=PASS|' admit.hbp
          cp admit.hbp adm/ADMIT.hbp
      - uses: actions/upload-artifact@v4
        with:
          name: admit-receipt
          retention-days: 90
          if-no-files-found: error
          path: |
            adm/ADMIT-FILES.sha256
            adm/ADMIT.hbp
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-parts
          retention-days: 30
          if-no-files-found: error
          path: adm/parts
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-_unsplit
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/_unsplit
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-count_3_3_-1_-1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/count_3_3_-1_-1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-count_3_3_-1_1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/count_3_3_-1_1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-count_3_3_1_-1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/count_3_3_1_-1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-count_3_3_1_1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/count_3_3_1_1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-tacount_3_3_1_-1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/tacount_3_3_1_-1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-tacount_3_3_1_1_1000_9000_52533422_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/tacount_3_3_1_1_1000_9000_52533422_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-tacount_3_3_1_1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/tacount_3_3_1_1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-tdcount_3_3_1_-1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/tdcount_3_3_1_-1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-tdcount_3_3_1_1_1000_9000_52533422_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/tdcount_3_3_1_1_1000_9000_52533422_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-tdcount_3_3_1_1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/tdcount_3_3_1_1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-txcount_3_3_-1_-1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/txcount_3_3_-1_-1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-txcount_3_3_-1_1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/txcount_3_3_-1_1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-txcount_3_3_1_-1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/txcount_3_3_1_-1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-txcount_3_3_1_1_1000_9000_52533422_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/txcount_3_3_1_1_1000_9000_52533422_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-txcount_3_3_1_1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/txcount_3_3_1_1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-tycount_3_3_-1_-1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/tycount_3_3_-1_-1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-tycount_3_3_-1_1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/tycount_3_3_-1_1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-tycount_3_3_1_-1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/tycount_3_3_1_-1_1000_9000_71900000_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-tycount_3_3_1_1_1000_9000_52533422_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/tycount_3_3_1_1_1000_9000_52533422_12_1000
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-cells-tycount_3_3_1_1_1000_9000_71900000_12_1000
          retention-days: 30
          if-no-files-found: error
          path: adm/cells/tycount_3_3_1_1_1000_9000_71900000_12_1000

  sectors:
    name: Watch sector ${{ matrix.id }} ${{ matrix.spec }}

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: "s01", spec: "sector/3/3/-1/-1", grp: "none"}
          - {id: "s02", spec: "sector/3/3/-1/1", grp: "none"}
          - {id: "s03", spec: "sector/3/3/1/-1", grp: "none"}
          - {id: "s04", spec: "sector/3/3/1/1", grp: "none"}
          - {id: "s05", spec: "tasector/3/3/1/-1", grp: "none"}
          - {id: "s06", spec: "tasector/3/3/1/1", grp: "none"}
          - {id: "s07", spec: "tdsector/3/3/1/-1", grp: "none"}
          - {id: "s08", spec: "tdsector/3/3/1/1", grp: "none"}
          - {id: "s09", spec: "txsector/3/3/-1/-1", grp: "none"}
          - {id: "s10", spec: "txsector/3/3/-1/1", grp: "none"}
          - {id: "s11", spec: "txsector/3/3/1/-1", grp: "none"}
          - {id: "s12", spec: "txsector/3/3/1/1", grp: "none"}
          - {id: "s13", spec: "tysector/3/3/-1/-1", grp: "none"}
          - {id: "s14", spec: "tysector/3/3/-1/1", grp: "none"}
          - {id: "s15", spec: "tysector/3/3/1/-1", grp: "none"}
          - {id: "s16", spec: "tysector/3/3/1/1", grp: "none"}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: Build offline from vendored sources
        working-directory: native/ym
        run: cargo build --release --offline --locked
      - name: Re-execute through HTTP-0
        env:
          HEBC_YM_FRESH: "1"
        run: |
          set -euo pipefail
          B=native/ym/target/release/hebc_ym_http0; R=$RUNNER_TEMP/root; spec="${{ matrix.spec }}"
          kind=${spec%%/*}; rest=${spec#*/}
          case $kind in *countmerge) mode=${kind%countmerge} ;; *countcols) mode=${kind%countcols} ;; *count) mode=${kind%count} ;; *sector) mode=${kind%sector} ;; esac
          sec="${mode}sector/$(echo $rest | cut -d/ -f1-4)"; id=$(echo $spec | tr / _)
          if [ "$kind" = "${mode}countmerge" ]; then
            cid=$(echo "${mode}count/$rest" | tr / _); mkdir -p $R/scol/$cid
            for d in c*/shards; do cp -r $d/${mode}countcols_$(echo $rest | tr / _)_* $R/scol/$cid/ 2>/dev/null || true; done
            ls $R/scol/$cid | grep -q . || { echo "CERTIFY_WATCH|error=no_cells|spec=$spec|json=0"; exit 1; }
          fi
          if [ "$kind" = "${mode}sector" ]; then specs="$spec"; else specs="$sec $spec"; fi
          OUT_ID=out/http0/$id.hbp bash native/ym/scripts/http0_jobs.sh $B $R 8100 $specs
          mkdir -p out/shards; cp -r $R/shards/$id out/shards/
      - uses: actions/upload-artifact@v4
        with:
          name: watch-sector-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: out
  finals:
    name: Watch final ${{ matrix.id }} ${{ matrix.spec }}
    needs: admit
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: "f01", spec: "count/3/3/-1/-1/1000/9000/52533422/12/1000", grp: "none"}
          - {id: "f02", spec: "count/3/3/-1/1/1000/9000/52533422/12/1000", grp: "none"}
          - {id: "f03", spec: "count/3/3/1/-1/1000/9000/52533422/12/1000", grp: "none"}
