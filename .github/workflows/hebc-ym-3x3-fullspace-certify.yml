          - {id: "f05", spec: "tacount/3/3/1/-1/1000/9000/52533422/12/1000", grp: "none"}
          - {id: "f06", spec: "tacountmerge/3/3/1/1/1000/9000/52533422/12/1000", grp: "tacount_3_3_1_1_1000_9000_52533422_12_1000"}
          - {id: "f07", spec: "tdcount/3/3/1/-1/1000/9000/52533422/12/1000", grp: "none"}
          - {id: "f08", spec: "tdcountmerge/3/3/1/1/1000/9000/52533422/12/1000", grp: "tdcount_3_3_1_1_1000_9000_52533422_12_1000"}
          - {id: "f09", spec: "txcount/3/3/-1/-1/1000/9000/52533422/12/1000", grp: "none"}
          - {id: "f10", spec: "txcount/3/3/-1/1/1000/9000/52533422/12/1000", grp: "none"}
          - {id: "f11", spec: "txcount/3/3/1/-1/1000/9000/52533422/12/1000", grp: "none"}
          - {id: "f12", spec: "txcountmerge/3/3/1/1/1000/9000/52533422/12/1000", grp: "txcount_3_3_1_1_1000_9000_52533422_12_1000"}
          - {id: "f13", spec: "tycount/3/3/-1/-1/1000/9000/52533422/12/1000", grp: "none"}
          - {id: "f14", spec: "tycount/3/3/-1/1/1000/9000/52533422/12/1000", grp: "none"}
          - {id: "f15", spec: "tycount/3/3/1/-1/1000/9000/52533422/12/1000", grp: "none"}
          - {id: "f16", spec: "tycountmerge/3/3/1/1/1000/9000/52533422/12/1000", grp: "tycount_3_3_1_1_1000_9000_52533422_12_1000"}
          - {id: "f17", spec: "countmerge/3/3/-1/-1/1000/9000/71900000/12/1000", grp: "count_3_3_-1_-1_1000_9000_71900000_12_1000"}
          - {id: "f18", spec: "countmerge/3/3/-1/1/1000/9000/71900000/12/1000", grp: "count_3_3_-1_1_1000_9000_71900000_12_1000"}
          - {id: "f19", spec: "countmerge/3/3/1/-1/1000/9000/71900000/12/1000", grp: "count_3_3_1_-1_1000_9000_71900000_12_1000"}
          - {id: "f20", spec: "countmerge/3/3/1/1/1000/9000/71900000/12/1000", grp: "count_3_3_1_1_1000_9000_71900000_12_1000"}
          - {id: "f21", spec: "tacountmerge/3/3/1/-1/1000/9000/71900000/12/1000", grp: "tacount_3_3_1_-1_1000_9000_71900000_12_1000"}
          - {id: "f22", spec: "tacountmerge/3/3/1/1/1000/9000/71900000/12/1000", grp: "tacount_3_3_1_1_1000_9000_71900000_12_1000"}
          - {id: "f23", spec: "tdcountmerge/3/3/1/-1/1000/9000/71900000/12/1000", grp: "tdcount_3_3_1_-1_1000_9000_71900000_12_1000"}
          - {id: "f24", spec: "tdcountmerge/3/3/1/1/1000/9000/71900000/12/1000", grp: "tdcount_3_3_1_1_1000_9000_71900000_12_1000"}
          - {id: "f25", spec: "txcountmerge/3/3/-1/-1/1000/9000/71900000/12/1000", grp: "txcount_3_3_-1_-1_1000_9000_71900000_12_1000"}
          - {id: "f26", spec: "txcountmerge/3/3/-1/1/1000/9000/71900000/12/1000", grp: "txcount_3_3_-1_1_1000_9000_71900000_12_1000"}
          - {id: "f27", spec: "txcountmerge/3/3/1/-1/1000/9000/71900000/12/1000", grp: "txcount_3_3_1_-1_1000_9000_71900000_12_1000"}
          - {id: "f28", spec: "txcountmerge/3/3/1/1/1000/9000/71900000/12/1000", grp: "txcount_3_3_1_1_1000_9000_71900000_12_1000"}
          - {id: "f29", spec: "tycountmerge/3/3/-1/-1/1000/9000/71900000/12/1000", grp: "tycount_3_3_-1_-1_1000_9000_71900000_12_1000"}
          - {id: "f30", spec: "tycountmerge/3/3/-1/1/1000/9000/71900000/12/1000", grp: "tycount_3_3_-1_1_1000_9000_71900000_12_1000"}
          - {id: "f31", spec: "tycountmerge/3/3/1/-1/1000/9000/71900000/12/1000", grp: "tycount_3_3_1_-1_1000_9000_71900000_12_1000"}
          - {id: "f32", spec: "tycountmerge/3/3/1/1/1000/9000/71900000/12/1000", grp: "tycount_3_3_1_1_1000_9000_71900000_12_1000"}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: admit-receipt
          path: admit
      - uses: actions/download-artifact@v4
        if: matrix.grp != 'none'
        with:
          name: admitted-cells-${{ matrix.grp }}
          path: c1
      - name: Check admitted cells
        if: matrix.grp != 'none'
        run: python3 native/ym/python/certify_admit.py check admit/ADMIT-FILES.sha256 cells/${{ matrix.grp }}/ c1
      - name: Toolchain 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: Build offline from vendored sources
        working-directory: native/ym
        run: cargo build --release --offline --locked
      - name: Re-execute through HTTP-0
        env:
          HEBC_YM_FRESH: "1"
        run: |
          set -euo pipefail
          B=native/ym/target/release/hebc_ym_http0; R=$RUNNER_TEMP/root; spec="${{ matrix.spec }}"
          kind=${spec%%/*}; rest=${spec#*/}
          case $kind in *countmerge) mode=${kind%countmerge} ;; *countcols) mode=${kind%countcols} ;; *count) mode=${kind%count} ;; *sector) mode=${kind%sector} ;; esac
          sec="${mode}sector/$(echo $rest | cut -d/ -f1-4)"; id=$(echo $spec | tr / _)
          if [ "$kind" = "${mode}countmerge" ]; then
            cid=$(echo "${mode}count/$rest" | tr / _); mkdir -p $R/scol/$cid
            for d in c*/shards; do cp -r $d/${mode}countcols_$(echo $rest | tr / _)_* $R/scol/$cid/ 2>/dev/null || true; done
            ls $R/scol/$cid | grep -q . || { echo "CERTIFY_WATCH|error=no_cells|spec=$spec|json=0"; exit 1; }
          fi
          if [ "$kind" = "${mode}sector" ]; then specs="$spec"; else specs="$sec $spec"; fi
          OUT_ID=out/http0/$id.hbp bash native/ym/scripts/http0_jobs.sh $B $R 8100 $specs
          mkdir -p out/shards; cp -r $R/shards/$id out/shards/
      - uses: actions/upload-artifact@v4
        with:
          name: watch-final-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: out
  sample:
    name: Watch sample ${{ matrix.id }} ${{ matrix.spec }}

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {id: "s01", spec: "tdcountcols/3/3/1/-1/1000/9000/71900000/12/1000/0/100", grp: "none"}
          - {id: "s02", spec: "countcols/3/3/1/1/1000/9000/71900000/12/1000/300/389", grp: "none"}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: Build offline from vendored sources
        working-directory: native/ym
        run: cargo build --release --offline --locked
      - name: Re-execute through HTTP-0
        env:
          HEBC_YM_FRESH: "1"
        run: |
          set -euo pipefail
          B=native/ym/target/release/hebc_ym_http0; R=$RUNNER_TEMP/root; spec="${{ matrix.spec }}"
          kind=${spec%%/*}; rest=${spec#*/}
          case $kind in *countmerge) mode=${kind%countmerge} ;; *countcols) mode=${kind%countcols} ;; *count) mode=${kind%count} ;; *sector) mode=${kind%sector} ;; esac
          sec="${mode}sector/$(echo $rest | cut -d/ -f1-4)"; id=$(echo $spec | tr / _)
          if [ "$kind" = "${mode}countmerge" ]; then
            cid=$(echo "${mode}count/$rest" | tr / _); mkdir -p $R/scol/$cid
            for d in c*/shards; do cp -r $d/${mode}countcols_$(echo $rest | tr / _)_* $R/scol/$cid/ 2>/dev/null || true; done
            ls $R/scol/$cid | grep -q . || { echo "CERTIFY_WATCH|error=no_cells|spec=$spec|json=0"; exit 1; }
          fi
          if [ "$kind" = "${mode}sector" ]; then specs="$spec"; else specs="$sec $spec"; fi
          OUT_ID=out/http0/$id.hbp bash native/ym/scripts/http0_jobs.sh $B $R 8100 $specs
          mkdir -p out/shards; cp -r $R/shards/$id out/shards/
      - uses: actions/upload-artifact@v4
        with:
          name: watch-sample-${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error
          path: out

  assemble:
    name: Assemble, gate and verdict
    needs: [admit, sectors, finals, sample]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: admit-receipt
          path: admit
      - uses: actions/download-artifact@v4
        with:
          name: admitted-parts
          path: root/parts
      - uses: actions/download-artifact@v4
        with:
          pattern: admitted-cells-*
          path: c1
          merge-multiple: true
      - name: Check every admitted input before assembly
        run: |
          set -euo pipefail
          test "${{ needs.admit.result }}" = success
          python3 native/ym/python/certify_admit.py check admit/ADMIT-FILES.sha256 parts/ root/parts
          python3 native/ym/python/certify_admit.py check admit/ADMIT-FILES.sha256 cells/ c1 strip
      - uses: actions/download-artifact@v4
        with:
          pattern: watch-sector-*
          path: wsector
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: watch-final-*
          path: wfinal
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: watch-sample-*
          path: wsample
          merge-multiple: true
      - name: Certify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          test "${{ needs.sectors.result }}" = success || echo "CERTIFY|watch_sectors=${{ needs.sectors.result }}|json=0"
          R=root; mkdir -p $R/cells $R/watch
          cp native/ym/results/3x3_full_space/HEBC-YM-3X3-FULLSPACE-CORES-T1-TF.hbp $R/cores.hbp; cp native/ym/results/3x3_full_space/HEBC-YM-3X3-FULLSPACE-CORES-T1-TF.sha256 $R/cores.sha256
          cp native/ym/results/3x3_full_space/HEBC-YM-3X3-FULLSPACE-STAGE-A-R9.hbp $R/stageA.hbp; cp native/ym/results/3x3_full_space/HEBC-YM-3X3-FULLSPACE-STAGE-A-R9.sha256 $R/stageA.sha256
          for d in c*/shards; do cp -r $d/* $R/cells/; done
          mv wsector/shards $R/watch/sectors; mv wfinal/shards $R/watch/finals; mv wsample/shards $R/watch/sample
          mkdir -p $R/watch/http0; for k in wsector wfinal wsample; do cp $k/http0/*.hbp $R/watch/http0/; done
          python3 native/ym/python/certify_timing.py ${{ github.repository }} ${{ github.run_id }} 40392589541 40392589603 > $R/timing.hbp || true
          CERTIFY_RUNS=40392589541,40392589603 python3 native/ym/python/full_space_certify.py assemble $R 52533422 71900000 | tee CERTIFY-3X3-FULLSPACE.hbp
          rc=${PIPESTATUS[0]}
          echo "CERTIFY_ADMISSION|admit_files_sha256=$(sha256sum admit/ADMIT-FILES.sha256 | cut -c1-64)|manifest_part1_sha256=$(sha256sum native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART1.hbp | cut -c1-64)|manifest_part2_sha256=$(sha256sum native/ym/results/3x3_full_space/CERTIFY-ADMIT-MANIFEST-PART2.hbp | cut -c1-64)|admit_total=$(grep '^ADMIT_TOTAL|' admit/ADMIT.hbp | cut -d'|' -f2-4)|json=0" >> CERTIFY-3X3-FULLSPACE.hbp
          sha256sum CERTIFY-3X3-FULLSPACE.hbp > CERTIFY-3X3-FULLSPACE.sha256
          exit $(( rc == 2 ? 1 : 0 ))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certify-3x3-fullspace
          retention-days: 90
          path: |
            CERTIFY-3X3-FULLSPACE.hbp
            CERTIFY-3X3-FULLSPACE.sha256
