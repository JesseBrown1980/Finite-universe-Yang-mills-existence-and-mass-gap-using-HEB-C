name: Q3 prism-x3 isolated evidence replay
on:
  pull_request:
    paths:
      - 'native/ym/results/qprism-three-2026-10-30/**'
      - '.github/workflows/q3-prism-three-evidence.yml'
  workflow_dispatch:
jobs:
  q3-registered-prism-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replay all 54 variants and enforce exact HBP bytes
        shell: bash
        run: |
          set -euo pipefail
          cd native/ym/results/qprism-three-2026-10-30
          echo "f880459cef7c5f00c194f19691429347d499545e2c232732be42bba92434780c  PREREG.hbp" | sha256sum -c
          python3 q3_test.py
          echo "5875929926f4fdfdb1b8577839e675a87aed51cf157bb82851dbe816ffd7dc5c  RESULT.hbp" | sha256sum -c
          grep -F 'P8=PASS|cases=54|prism_count=3|paths=27|result=PASS|physical_ftl_observed=0' RESULT.hbp
