# The operator's rule: "We can't use float." Every pull request's code is scanned for binary floating point and Python's fractions, and anything found outside native/scripts/FLOAT-EVIDENCE.txt fails.
# Floating-point evidence stays where it is, with its integer redo beside it. Integer only, json=0.
name: No floating point

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  no-float:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: The gate reads its own test snippets
        run: python3 -I -X utf8 native/scripts/no_float_gate.py --selftest
      - name: Scan all tracked code
        run: python3 -I -X utf8 native/scripts/no_float_gate.py .
      - name: The gate goes red on planted floats and fractions
        run: |
          set -euo pipefail
          git config user.name gate-control
          git config user.email gate-control@localhost
          for plant in 'x = 1 / 2|planted_float.py' 'import time; x = time.time()|planted_clock.py' 'fn f() -> u8 { let a = 0.5; 1 }|planted_float.rs' 'import fractions|planted_fractions.py' 'from fractions import Fraction as F|planted_fraction_as.py' 'x = 1 / 2|planted-é.py' 'fn f(d: std::time::Duration) -> u64 { d.as_secs_f64() as u64 }|planted_duration.rs' 'x = d.total_seconds()|planted_seconds.py' 'x = d["a"] / 2|planted_keyed.py' '<script>let a = new Float64Array(2);</script>|planted_array.html'; do
            file="native/scripts/${plant##*|}"
            printf '%s\n' "${plant%|*}" > "$file"
            git add "$file"
            if python3 -I -X utf8 native/scripts/no_float_gate.py . > /tmp/planted.out; then echo "the gate passed $file"; exit 1; fi
            grep -q "file=$file" /tmp/planted.out
            git rm -q -f --cached "$file"
            rm -f "$file"
          done
          echo '# one more' >> native/ym/results/3x4_stream/perron/warmcal.py
          echo 'y = 1.5' >> native/ym/results/3x4_stream/perron/warmcal.py
          if python3 -I -X utf8 native/scripts/no_float_gate.py . > /tmp/planted.out; then echo 'the gate passed one more float in a listed file'; exit 1; fi
          grep -q 'count_moved=native/ym/results/3x4_stream/perron/warmcal.py' /tmp/planted.out
          git checkout -q -- native/ym/results/3x4_stream/perron/warmcal.py
      - name: The integer pair against CPython's class, and every planted break seen
        run: |
          set -euo pipefail
          python3 -I -X utf8 native/scripts/test_intpair.py 27 20000
          python3 -I -X utf8 native/scripts/test_intpair.py --teeth
      - name: Every integer copy regenerates byte-exact from its original, and reads clean
        run: |
          set -euo pipefail
          python3 -I -X utf8 native/scripts/make_integer_pairs.py --selftest
          python3 -I -X utf8 native/scripts/make_integer_pairs.py . --check | tee /tmp/copies.out
          grep -q '^INTEGER_COPIES_DONE|copies=25|divisions_to_qdiv=35|differ=0|' /tmp/copies.out
          H=native/ym/results/integer-pairs-2026-11-03
          python3 -I -X utf8 native/scripts/integer_only_audit.py --selftest
          python3 -X utf8 native/scripts/integer_only_audit.py native/scripts/intpair.py native/scripts/make_integer_pairs.py "$H/run_cases.py" "$H/run_original_redirected.py" "$H/check_climb_estimate.py" "$H/test_runlog.py" "$H/check_test_c_integer.py" native/ym/results/z-one-matrix-20261030/curve_ABC/C/test_c_integer.py
      - name: The redone items, in integers
        run: |
          set -euo pipefail
          P=native/ym/results/3x4_stream/perron
          python3 -I -X utf8 native/ym/independent/gpt6_3x4_meta_check_integer.py
          python3 -I -X utf8 "$P/warmcal_integer.py" "$P/WARMCAL-small.hbp"
          python3 native/scripts/integer_only_audit.py native/ym/independent/gpt6_3x4_meta_check_integer.py "$P/warmcal_integer.py"
      - name: The division check goes red on a float
        run: |
          printf 'x = 1 / 2\n' > /tmp/plant.py
          rc=0
          python3 -I -X utf8 native/ym/results/3x4_stream/perron/second-seat/integer-redo/checked_division.py /tmp/plant.py || rc=$?
          test "$rc" = 3
