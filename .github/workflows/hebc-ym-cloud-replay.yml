# Exact-head replay of the cloud seat's result packages (native/ym/results/*-cloud/).
# For every package present: verify SHA256SUMS and the HASH seal, then run its run.sh, which checks
# the prediction seal, rebuilds with Rust 1.81, runs clippy -D warnings and checks the output is
# byte-identical to the recorded HBP. Fail-closed: any missing file, failed sum, seal mismatch,
# build failure or byte difference fails the job. Integer only, json=0.
name: HEB-C YM cloud-seat result replay (Rust 1.81)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/ym/results/*-cloud/**'
      - '.github/workflows/hebc-ym-cloud-replay.yml'

permissions:
  contents: read

jobs:
  replay:
    name: Replay cloud-seat packages on the exact head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.81 with clippy
        run: rustup toolchain install 1.81.0 --profile minimal -c clippy
      - name: Verify chains and replay
        run: |
          set +e
          set -uo pipefail
          o=CLOUD-REPLAY.hbp; : > $o; bad=0; n=0
          echo "CLOUD_REPLAY|run=$GITHUB_RUN_ID|commit=$GITHUB_SHA|json=0" >> $o
          for d in native/ym/results/*-cloud; do
            [ -f "$d/run.sh" ] || continue
            n=$((n+1))
            seal=$(ls $d/*.seal 2>/dev/null | head -1); hbi=$(ls $d/*.hbi 2>/dev/null | head -1)
            sums=0; (cd $d && sha256sum -c --quiet SHA256SUMS) && sums=1
            sealok=0
            if [ -n "$seal" ] && [ -n "$hbi" ]; then
              [ "$(cat $d/SHA256SUMS $hbi | sha256sum | cut -c1-64)" = "$(cat $seal)" ] && sealok=1
            fi
            bash $d/run.sh > rep.txt 2>&1; rc=$?
            grep -E '^(REPLAY|ZLIGHT_REPRO|ZLIGHT_CLIPPY|ZLIGHT_TOOLCHAIN|ZLIGHT_REPRO_EXIT)\|' rep.txt | sed "s#^#PKG|dir=$(basename $d)|#" >> $o
            ok=0; [ $sums = 1 ] && [ $sealok = 1 ] && [ $rc = 0 ] && ok=1; [ $ok = 1 ] || { bad=1; cat rep.txt; }
            echo "PACKAGE|dir=$(basename $d)|sha256sums=$sums|seal=$sealok|replay_exit=$rc|ok=$ok|json=0" >> $o
          done
          [ $n -gt 0 ] || bad=1
          echo "CLOUD_REPLAY_RESULT|packages=$n|all_ok=$([ $bad = 0 ] && echo 1 || echo 0)|json=0" >> $o
          cat $o
          [ $bad = 0 ]
