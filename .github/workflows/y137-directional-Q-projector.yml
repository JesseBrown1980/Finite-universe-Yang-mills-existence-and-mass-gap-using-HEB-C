name: Issue 137 Q-directional Schur drift integer bound
on:
  pull_request:
    paths:
      - 'independent/y137-directional-Q-projector-20261113/**'
      - '.github/workflows/y137-directional-Q-projector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q-directional-schur:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify frozen prediction and original graph source
        run: |
          set -euo pipefail
          D=independent/y137-directional-Q-projector-20261113
          test "$(git hash-object "$D/PREDICTION.hbp")" = "dfb2d2401e5acca3d10e3d56b10b1fed9af53418"
          grep -Fq 'FROZEN_BEFORE_DIRECTIONAL_Q_REPLAY' "$D/PREDICTION.hbp"
          test "$(sha256sum independent/y137-liftfree-k3-20261113/src155/y137_k3_sector_isolation.py | cut -d' ' -f1)" = "f3461aa8a50cfa9efb4a1bbdc2d7be44ec1d4a13c80c47fd55fa07de60be28ff"
          test "$(git hash-object independent/finite_s3_3x4_r9_first_gap.py)" = "91bd1e80cbfcfb76198966aa177d097ecfbe8143"
      - name: Compute two Q directional Schur residual bounds and independent old-bound replay
        run: |
          set -euo pipefail
          mkdir -p build/y137-qdir
          python3 -I -B independent/y137-directional-Q-projector-20261113/replay.py | tee build/y137-qdir/replay.stdout.txt
          test "$(grep -c '^Y137_QDIR_POINT|' build/y137-qdir/replay.stdout.txt)" -eq 2
          grep -Fq 'Y137_QDIR_VERDICT|samples=2|' build/y137-qdir/replay.stdout.txt
          grep -Fq 'actual_first_Wilson_weight=OPEN|' build/y137-qdir/replay.stdout.txt
      - name: Strict no-floating point and integer-only audit
        run: |
          set -euo pipefail
          python3 -I -X utf8 native/scripts/no_float_gate.py .
          python3 -I -X utf8 native/scripts/integer_only_audit.py independent/y137-directional-Q-projector-20261113/replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y137-directional-Q-Schur-error-integer
          path: build/y137-qdir/replay.stdout.txt
          if-no-files-found: ignore
          retention-days: 60
