name: Integer Z2xZ2 sector reduction and four full inertia controls

on:
  push:
    branches: [seat-yang-mills-integer-translation-sectors]
  pull_request:
    branches: [seat-yang-mills-adaptive-monotone-cells]

permissions:
  contents: read

jobs:
  integer-translation-sectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Strict integer-only code audit
        shell: bash
        run: |
          set -euo pipefail
          python3 independent/seat_integer_ratio.py
          python3 independent/seat_integer_only_gate.py
      - name: Reconstruct source and project exact lattice translations
        shell: bash
        run: |
          set -euo pipefail
          python3 independent/seat_translation_sectors.py /tmp/sector_s3 | tee /tmp/sector_s3.measure
          cmp /tmp/sector_s3.measure independent/seat_translation_sectors.measure
          test "$(wc -l < /tmp/sector_s3.measure)" -eq 5
          grep -F 'sum_dim=1393|sum_sector_nnz=27045' /tmp/sector_s3.measure
          grep -F 'intertwining=EXACT_INTEGER' /tmp/sector_s3.measure
          for name in pp pm mp mm; do
            test -s "/tmp/sector_s3/$name.matrix"
          done
          sha256sum /tmp/sector_s3/*.matrix
      - name: Reproduce full Sturm inertia count across all sectors
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 independent/seat_translation_sturm.py /tmp/sector_s3 1 1 13240 30 1
            python3 independent/seat_translation_sturm.py /tmp/sector_s3 3 5 50840 30 1
            python3 independent/seat_translation_sturm.py /tmp/sector_s3 1 1 7000 30 0
            python3 independent/seat_translation_sturm.py /tmp/sector_s3 1 1 13300 30 3
          } | tee /tmp/sector_inertia.measure
          cmp /tmp/sector_inertia.measure independent/seat_translation_sturm.measure
          test "$(wc -l < /tmp/sector_inertia.measure)" -eq 4
          test "$(grep -c 'pivots=1393/1393' /tmp/sector_inertia.measure)" -eq 4
          test "$(grep -c 'ambiguous=0' /tmp/sector_inertia.measure)" -eq 4
          test "$(grep -c '|json=0$' /tmp/sector_inertia.measure)" -eq 4
      - name: Reject modified matrix hash
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/sector_s3 /tmp/sector_s3_tampered
          printf 9 | dd of=/tmp/sector_s3_tampered/pp.matrix bs=1 seek=15 conv=notrunc status=none
          if python3 independent/seat_translation_sturm.py /tmp/sector_s3_tampered 1 1 13240 30 1; then
            echo 'FAIL: modified SHA-pinned translation sector accepted'
            exit 1
          fi
          echo 'HEBC-TRANSLATION|result=PASS|tamper=REJECTED|json=0'
