name: HEB-C CHSH third-seat Python evidence replay
on:
  pull_request:
    paths:
      - 'native/ym/results/chsh-prism3-2026-10-30-third-seat/**'
      - '.github/workflows/hebc-chsh-third-seat-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen records and byte-exact Python replay
        working-directory: native/ym/results/chsh-prism3-2026-10-30-third-seat
        run: sh run.sh
