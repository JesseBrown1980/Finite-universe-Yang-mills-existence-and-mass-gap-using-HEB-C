          - {r: 127}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: Build offline from vendored sources
        working-directory: native/ym
        run: cargo build --release --offline --locked
      - name: Stream one residue class
        working-directory: native/ym
        run: |
          set -euo pipefail
          mkdir -p out
          o=out/class-${{ matrix.r }}.hbp
          WORKERS=$(nproc) target/release/ymstream 3 4 1000 9000 60000000,62000000,64000000,66000000,68000000,70000000,72000000,74000000,76000000,78000000,80000000,82000000,84000000,86000000,88000000,90000000,92000000,94000000,96000000,98000000,100000000,102000000,104000000,106000000,108000000,110000000 ${{ matrix.r }} 128 | tee $o
          grep -q '^YMSTREAM|' $o
          echo "GITRAM_CELL|class=${{ matrix.r }}/128|workers=$(nproc)|json=0" >> $o
          (cd out && sha256sum class-${{ matrix.r }}.hbp > class-${{ matrix.r }}.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-${{ matrix.r }}
          retention-days: 30
          if-no-files-found: error
          path: native/ym/out

  fan-in:
    name: Fan-in, Burnside and character-formula checks, seal
    needs: cell
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: class-*
          path: fan-in
          merge-multiple: true
      - name: Check and seal
        run: |
          set -euo pipefail
          F=HEBC-YM-STREAM-3X4-PILOT
          (cd fan-in && sha256sum -c class-*.sha256)
          cat fan-in/class-*.hbp > $F.hbp
          python3 native/ym/python/stream_fanin.py fan-in/class-*.hbp | tee -a $F.hbp
          grep -q '^YMSTREAM_FANIN|.*|result=PASS|' $F.hbp
          echo "GITRAM_SEAL|name=stream-3x4-pilot|cells=128|status=PASS|json=0" >> $F.hbp
          sha256sum $F.hbp > $F.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-stream-3x4-pilot
          retention-days: 30
          if-no-files-found: error
          path: HEBC-YM-STREAM-3X4-PILOT.*
