# GitRAM streaming lane (stream-3x4-pilot): ymstream on the 3x4 lattice, the
# Host8 / SG-RAM method. Every cell streams one residue class of the 6^k
# gauge-fixed configuration space with constant memory; no matrix is stored.
# Records: gauge orbits (against Burnside), per-op fixed-point counts (the
# character formula for every sector's dimension, against the representative
# count), flat states, and diagonal-dominance core rows at each threshold.
# Generated by native/ym/python/stream_workflow.py. Integer-only, json=0.
name: HEB-C YM stream-3x4-pilot (128 cells)

on:
  workflow_dispatch:
  push:
    branches: [http0-ym-backend-finite-volumes]
    paths: ['.github/workflows/hebc-ym-stream-3x4-pilot.yml']

permissions:
  contents: read

concurrency:
  group: hebc-ym-stream-3x4-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cell:
    name: Class ${{ matrix.r }}/128
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {r: 0}
          - {r: 1}
          - {r: 2}
          - {r: 3}
          - {r: 4}
          - {r: 5}
          - {r: 6}
          - {r: 7}
          - {r: 8}
          - {r: 9}
          - {r: 10}
          - {r: 11}
          - {r: 12}
          - {r: 13}
          - {r: 14}
          - {r: 15}
          - {r: 16}
          - {r: 17}
          - {r: 18}
          - {r: 19}
          - {r: 20}
          - {r: 21}
          - {r: 22}
          - {r: 23}
          - {r: 24}
          - {r: 25}
          - {r: 26}
          - {r: 27}
          - {r: 28}
          - {r: 29}
          - {r: 30}
          - {r: 31}
          - {r: 32}
          - {r: 33}
          - {r: 34}
