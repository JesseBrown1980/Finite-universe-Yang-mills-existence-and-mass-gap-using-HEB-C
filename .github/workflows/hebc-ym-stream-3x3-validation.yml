# GitRAM streaming lane (stream-3x3-validation): ymstream on the 3x3 lattice, the
# Host8 / SG-RAM method. Every cell streams one residue class of the 6^k
# gauge-fixed configuration space with constant memory; no matrix is stored.
# Records: gauge orbits (against Burnside), per-op fixed-point counts (the
# character formula for every sector's dimension, against the representative
# count), flat states, and diagonal-dominance core rows at each threshold.
# Generated by native/ym/python/stream_workflow.py. Integer-only, json=0.
name: HEB-C YM stream-3x3-validation (16 cells)

on:
  workflow_dispatch:
  push:
    branches: [http0-ym-backend-finite-volumes]
    paths: ['.github/workflows/hebc-ym-stream-3x3-validation.yml']

permissions:
  contents: read

concurrency:
  group: hebc-ym-stream-3x3-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cell:
    name: Class ${{ matrix.r }}/16
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {r: 0}
          - {r: 1}
          - {r: 2}
          - {r: 3}
          - {r: 4}
          - {r: 5}
          - {r: 6}
          - {r: 7}
          - {r: 8}
          - {r: 9}
          - {r: 10}
          - {r: 11}
          - {r: 12}
          - {r: 13}
          - {r: 14}
          - {r: 15}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain 1.81
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup override set 1.81.0
      - name: Build offline from vendored sources
        working-directory: native/ym
        run: cargo build --release --offline --locked
      - name: Stream one residue class
        working-directory: native/ym
        run: |
          set -euo pipefail
          mkdir -p out
          o=out/class-${{ matrix.r }}.hbp
          WORKERS=$(nproc) target/release/ymstream 3 3 1000 9000 52533422,76472000 ${{ matrix.r }} 16 | tee $o
          grep -q '^YMSTREAM|' $o
          echo "GITRAM_CELL|class=${{ matrix.r }}/16|workers=$(nproc)|json=0" >> $o
          (cd out && sha256sum class-${{ matrix.r }}.hbp > class-${{ matrix.r }}.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-${{ matrix.r }}
          retention-days: 30
          if-no-files-found: error
          path: native/ym/out

  fan-in:
    name: Fan-in, Burnside and character-formula checks, seal
    needs: cell
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: class-*
          path: fan-in
          merge-multiple: true
      - name: Check and seal
        run: |
          set -euo pipefail
          F=HEBC-YM-STREAM-3X3-VALIDATION
          (cd fan-in && sha256sum -c class-*.sha256)
          cat fan-in/class-*.hbp > $F.hbp
          python3 native/ym/python/stream_fanin.py fan-in/class-*.hbp | tee -a $F.hbp
          grep -q '^YMSTREAM_FANIN|.*|result=PASS|' $F.hbp
          # the stream must reproduce the stored-matrix sector results exactly
          while read -r sec states cores; do
            grep -q "^YMSTREAM_SECTOR_TOTAL|L=3x3|sector=$sec|states=$states|" $F.hbp
            for c in $(echo $cores | tr , ' '); do
              t=${c#*@}; n=${c%@*}
              grep "^YMSTREAM_SECTOR_TOTAL|L=3x3|sector=$sec|" $F.hbp | grep -q "[=,]$t:$n:"
            done
            echo "EXPECT|sector=$sec|states=$states|cores=$cores|match=1|json=0" >> $F.hbp
          done < native/ym/results/3x3_full_space/STREAM-EXPECT-3X3.txt
          echo "GITRAM_SEAL|name=stream-3x3-validation|cells=16|status=PASS|json=0" >> $F.hbp
          sha256sum $F.hbp > $F.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-stream-3x3-validation
          retention-days: 30
          if-no-files-found: error
          path: HEBC-YM-STREAM-3X3-VALIDATION.*
