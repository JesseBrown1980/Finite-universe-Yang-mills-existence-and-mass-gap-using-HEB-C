name: Fail-closed controls for allpairs
on:
  push:
    branches:
      - audit/allpairs-failclosed-20261103
permissions:
  contents: read
jobs:
  failclosed-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the outside seat's Go checker from its pinned source
        shell: bash
        run: |
          set -euo pipefail
          D=native/ym/results/3x4_stream/perron/outside-go-41509351749
          ( cd "$D" && sha256sum -c source.sha256 )
          go version
          mkdir -p /tmp/gochk
          cp "$D/perron_independent.go" /tmp/gochk/perron_independent.go
          ( cd /tmp/gochk && go build -o "$RUNNER_TEMP/perron_independent" perron_independent.go )
      - name: Build allpairs twice on Rust 1.81, the corrected source and the original at its pinned commit
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.81.0 --profile minimal
          S=native/ym/crates/evolvers/src/bin/allpairs.rs
          cp "$S" "$RUNNER_TEMP/corrected.rs"
          ( cd native/ym && cargo +1.81.0 build --locked --release -p evolvers --bin allpairs )
          cp native/ym/target/release/allpairs "$RUNNER_TEMP/allpairs-corrected"
          git show 8faadb07748417e713e95723f01d83e0ad80b93f:"$S" > "$S"
          echo "f4ea7e856728fde8a5fe56b0e9fe85a0770d930ea566c25b490f697760e55754  $S" | sha256sum -c -
          ( cd native/ym && cargo +1.81.0 build --locked --release -p evolvers --bin allpairs )
          cp native/ym/target/release/allpairs "$RUNNER_TEMP/allpairs-original"
          cp "$RUNNER_TEMP/corrected.rs" "$S"
          mkdir -p "$RUNNER_TEMP/out"
          {
            sha256sum "$RUNNER_TEMP/corrected.rs" "$RUNNER_TEMP/allpairs-corrected" "$RUNNER_TEMP/allpairs-original"
            rustc +1.81.0 -V
            go version
          } | sed "s#$RUNNER_TEMP/##" | tee "$RUNNER_TEMP/out/TOOLS.txt"
          if cmp -s "$RUNNER_TEMP/allpairs-corrected" "$RUNNER_TEMP/allpairs-original"; then
            echo "the two builds are the same file"
            exit 1
          fi
      - name: Run the fixture controls with the corrected allpairs
        shell: bash
        run: |
          set -euo pipefail
          F=native/ym/results/3x4_stream/perron/allpairs/fixture-controls
          status=0
          python3 -I -X utf8 "$F/run_fixture_controls.py" --base "$F/fixture-2x2.rooms.gz" --out "$RUNNER_TEMP/out/fixture" \
            --go "$RUNNER_TEMP/perron_independent" --strict native/ym/results/3x4_stream/perron/check_d_strict.py \
            --allpairs "$RUNNER_TEMP/allpairs-corrected" || status=$?
          cat "$RUNNER_TEMP/out/fixture/FIXTURE-CONTROLS.hbp" || true
          exit "$status"
      - name: Run the header controls on both executables
        shell: bash
        run: |
          set -euo pipefail
          A=native/ym/results/3x4_stream/perron/allpairs
          status=0
          python3 -I -X utf8 "$A/failclosed/run_header_controls.py" --base "$A/fixture-controls/fixture-2x2.rooms.gz" --out "$RUNNER_TEMP/out/header" \
            --original "$RUNNER_TEMP/allpairs-original" --corrected "$RUNNER_TEMP/allpairs-corrected" || status=$?
          grep -E '^HEADER_(TOOL|PREDICTION_SHA|SWEEP|CORRECTED_FAILS_CLOSED|DIFFERS|CONTROLS_DONE)' "$RUNNER_TEMP/out/header/HEADER-CONTROLS.hbp" || true
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failclosed-controls
          path: ${{ runner.temp }}/out
